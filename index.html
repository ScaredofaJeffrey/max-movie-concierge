<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAX</title><style>body{margin:0;background:#07080b;color:#f7f7f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;padding:20px 18px;background:radial-gradient(circle at 50% -10%,#292e39,#050609 65%)}.logo{text-align:center;font-weight:850;letter-spacing:8px;font-size:22px}.tag{text-align:center;color:#9da1aa;font-size:12px}.screen{min-height:calc(100vh - 70px);display:flex;flex-direction:column}.center{justify-content:center}.hero{text-align:center;margin:auto 0 25px}.hero h1{font-size:35px;line-height:1.05}.hero p,.small{color:#9da1aa}.top{display:flex;justify-content:space-between;align-items:center;margin:20px 0}.back{width:auto!important;background:none!important;border:0!important;color:#9da1aa!important;padding:4px!important}.progress{height:3px;background:#24262d;margin-bottom:25px}.progress i{display:block;height:100%;background:white}button{width:100%;padding:16px;margin:6px 0;border-radius:16px;border:1px solid #2a2d35;background:#15171c;color:#fff;font-size:16px;font-weight:650}button.primary{background:#f5f5f7;color:#08090b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid button{margin:0}.selected{background:#f5f5f7!important;color:#08090b!important}.chips{display:flex;flex-wrap:wrap;gap:7px}.chips button{width:auto;padding:10px 13px;border-radius:999px}.q{font-size:28px;line-height:1.1;margin:8px 0 20px}.footer{margin-top:auto;text-align:center;color:#666a73;font-size:10px;padding:20px}.input{width:100%;padding:14px;border-radius:14px;border:1px solid #2a2d35;background:#101217;color:white;font-size:15px;box-sizing:border-box}.poster{height:300px;border-radius:22px;background:#15171c;overflow:hidden;position:relative;margin-bottom:16px}.poster img{width:100%;height:100%;object-fit:cover}.poster div{position:absolute;bottom:0;padding:22px;width:100%;background:linear-gradient(transparent,#000);box-sizing:border-box}.title{font-size:30px;font-weight:850}.muted{color:#9da1aa;font-size:13px}.provider{padding:13px;border:1px solid #2a2d35;border-radius:14px;margin:14px 0}</style></head><body><div class="app"><div class="logo">MAX</div><div class="tag">Your personal movie concierge.</div><main id="root"></main></div><script>const API='https://api.themoviedb.org/3',IMG='https://image.tmdb.org/t/p/w780';let s={i:0,a:{},services:[],current:null};const root=document.getElementById('root'),tok=()=>localStorage.getItem('maxTmdbToken')||'';const qs=[['Movie or TV?',['🎬 Movie','📺 TV'],'type'],["What's the vibe?",['😂 Make me laugh','😮 Keep me hooked','🧠 Make me think','❤️ Something with feeling','😱 Freak me out','🎲 Surprise me'],'vibe'],['How much time have we got?',['Under 90 min','90–120 min','2+ hours',"Don't care"],'time'],['Something you\'ve seen before, or something new?',['Comfort pick','Something new','Surprise me'],'novelty'],['Where can I look?',['Netflix','Prime Video','Hulu','Disney+','Max','Paramount+','Peacock','Apple TV+','EVERYWHERE'],'services']];function home(){root.innerHTML='<section class="screen center"><div class="hero"><h1>What are we<br>watching?</h1><p>Stop scrolling. Start watching.</p></div><button class="primary" onclick="start()">🎙 Talk to MAX</button><button onclick="start()">🎲 MAX, PICK SOMETHING</button><button onclick="search()">🔎 Search the MAX universe</button><button onclick="settings()">⚙️ MAX Settings</button><div class="footer">MAX v0.5 · Real TMDB catalog</div></section>'}function start(){s.i=0;s.a={};s.services=[];q()}function q(){let x=qs[s.i];root.innerHTML='<section class="screen"><div class="top"><button class="back" onclick="'+(s.i?'prev()':'home()')+'">‹ Back</button><span class="muted">'+(s.i+1)+' / 5</span></div><div class="progress"><i style="width:'+((s.i+1)*20)+'%"></i></div><div class="q">'+x[0]+'</div><div id="c" class="'+(s.i===1||s.i===4?'grid':'')+'"></div><div id="next"></div><div class="footer">MAX learns from your choices.</div></section>';x[1].forEach(v=>{let b=document.createElement('button');b.textContent=v;if(s.i===4){b.onclick=()=>toggle(v,b)}else b.onclick=()=>{s.a[x[2]]=v;s.i++;s.i<5?q():finish()};document.getElementById('c').appendChild(b)});if(s.i===4){let b=document.createElement('button');b.className='primary';b.textContent='Find my pick →';b.onclick=finish;document.getElementById('next').appendChild(b)}}function toggle(v,b){if(v==='EVERYWHERE'){s.services=['EVERYWHERE'];document.querySelectorAll('#c button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}else{document.querySelector('#c button:last-child')?.classList.remove('selected');s.services=s.services.filter(x=>x!=='EVERYWHERE');b.classList.toggle('selected');if(b.classList.contains('selected'))s.services.push(v);else s.services=s.services.filter(x=>x!==v)}}function prev(){s.i--;q()}async function api(p){let r=await fetch(API+p,{headers:{Authorization:'Bearer '+tok()}});if(!r.ok)throw Error();return r.json()}async function finish(){if(!tok())return settings();root.innerHTML='<section class="screen center"><div class="hero"><h1>MAX is thinking…</h1><p>Searching the real catalog.</p></div></section>';try{let type=s.a.type?.includes('TV')?'tv':'movie',d=await api('/discover/'+type+'?language=en-US&region=US&sort_by=popularity.desc&include_adult=false&page=1'),items=(d.results||[]).filter(x=>(x.vote_count||0)>100);let m=items[Math.floor(Math.random()*Math.min(items.length,20))];s.current={...m,type,title:m.title||m.name};detail(s.current)}catch(e){root.innerHTML='<section class="screen center"><div class="hero"><h1>MAX hit a snag.</h1><p>Check TMDB in Settings.</p></div><button class="primary" onclick="settings()">Settings</button></section>'}}function detail(m){root.innerHTML='<section class="screen"><div class="top"><button class="back" onclick="home()">‹ Home</button><span class="muted">MAX PICK</span></div><div class="poster">'+(m.poster_path?'<img src="'+IMG+m.poster_path+'">':'')+'<div><div class="title">'+m.title+'</div><div class="muted">'+((m.release_date||m.first_air_date||'').slice(0,4))+' · TMDB '+Math.round((m.vote_average||0)*10)+'%</div></div></div><b>✦ '+Math.min(98,70+Math.round((m.vote_average||0)*3))+'% MAX MATCH</b><p class="small">'+(m.overview||'MAX found this in the real catalog.')+'</p><div class="provider" id="providers">Tap below to check U.S. availability.</div><button class="primary" onclick="providers()">📺 FIND WHERE TO WATCH</button><button onclick="finish()">NOPE — TRY AGAIN</button><div class="chips"><button onclick="learn(2)">❤️ Loved it</button><button onclick="learn(1)">👍 Liked it</button><button onclick="learn(-1)">👎 Nope</button></div></section>'}async function providers(){try{let d=await api('/'+s.current.type+'/'+s.current.id+'/watch/providers'),u=d.results?.US,n=[...(u?.flatrate||[]),...(u?.free||[]),...(u?.ads||[])].map(x=>x.provider_name),r=(u?.rent||[]).map(x=>x.provider_name);document.getElementById('providers').innerHTML=n.length?'<b>Stream in the U.S.</b><br><span class="muted">'+[...new Set(n)].join(' · ')+'</span>':'<span class="muted">No streaming availability returned by TMDB.</span>'+(r.length?'<br><br><b>Rent / buy</b><br><span class="muted">'+[...new Set(r)].join(' · ')+'</span>':'')}catch(e){document.getElementById('providers').textContent='Provider lookup failed.'}}function learn(n){let k=s.current.id,t=JSON.parse(localStorage.getItem('maxTaste')||'{}');t[k]=(t[k]||0)+n;localStorage.setItem('maxTaste',JSON.stringify(t));alert('MAX remembers that.')}function search(){root.innerHTML='<section class="screen"><div class="top"><button class="back" onclick="home()">‹ Home</button><span class="muted">SEARCH</span></div><div class="q">What are you looking for?</div><input class="input" id="query" placeholder="Movie, show, actor, director..."><button class="primary" onclick="doSearch()">Search</button><div id="results"></div></section>'}async function doSearch(){let q=document.getElementById('query').value;if(!q)return;let e=document.getElementById('results');e.innerHTML='<p class="small">MAX is searching…</p>';try{let d=await api('/search/multi?query='+encodeURIComponent(q)+'&include_adult=false&language=en-US&page=1');e.innerHTML=(d.results||[]).filter(x=>x.media_type==='movie'||x.media_type==='tv').slice(0,8).map(x=>'<button onclick="load('+x.id+',\''+x.media_type+'\')">'+(x.title||x.name)+'</button>').join('')}catch(x){e.textContent='Search failed.'}}async function load(id,type){let x=await api('/'+type+'/'+id+'?language=en-US');s.current={...x,id,type,title:x.title||x.name};detail(s.current)}function settings(){root.innerHTML='<section class="screen"><div class="top"><button class="back" onclick="home()">‹ Home</button><span class="muted">SETTINGS</span></div><div class="q">TMDB Connection</div><p class="small">Your token is stored only in this browser for the prototype.</p><input class="input" id="t" type="password" placeholder="TMDB Read Access Token" value="'+tok()+'"><button class="primary" onclick="save()">Save & Test TMDB</button></section>'}async function save(){let v=document.getElementById('t').value.trim();localStorage.setItem('maxTmdbToken',v);try{await fetch(API+'/configuration',{headers:{Authorization:'Bearer '+v}}).then(r=>{if(!r.ok)throw Error()});alert('TMDB connected.');home()}catch(e){localStorage.removeItem('maxTmdbToken');alert('Token failed.')}}home()</script></body></html>

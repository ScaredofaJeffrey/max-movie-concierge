<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07080b"><title>MAX — Your Personal Movie Concierge</title><style>:root{--bg:#07080b;--card:#15171c;--line:#2a2d35;--text:#f7f7f8;--muted:#9da1aa}*{box-sizing:border-box}body{margin:0;background:#020305;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;padding:20px 18px 26px;background:radial-gradient(circle at 50% -10%,#292e39 0,#0b0c10 35%,#050609 75%);overflow:hidden}.logo{text-align:center;font-weight:850;letter-spacing:8px;font-size:22px;margin:10px 0 3px}.tag{text-align:center;color:var(--muted);font-size:12px}.screen{min-height:calc(100vh - 76px);display:flex;flex-direction:column}.center{justify-content:center}.hero{text-align:center;margin:auto 0 28px}.hero h1{font-size:35px;line-height:1.04;margin:0 0 12px;letter-spacing:-1.3px}.hero p{color:var(--muted);font-size:16px;margin:0}button{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:16px;padding:16px;font-size:16px;font-weight:650;margin:6px 0;cursor:pointer}button.primary{background:#f5f5f7;color:#08090b;border-color:#f5f5f7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid button{margin:0}.chips{display:flex;flex-wrap:wrap;gap:7px}.chips button{width:auto;margin:0;padding:10px 13px;border-radius:999px;font-size:13px}.top{display:flex;justify-content:space-between;align-items:center;margin:20px 0 25px}.back{width:auto;border:0;background:none;padding:4px;color:var(--muted);margin:0}.q{font-size:28px;line-height:1.08;letter-spacing:-.8px;margin:10px 0 18px}.sub{font-size:14px;color:var(--muted);margin-bottom:14px}.progress{height:3px;background:#24262d;border-radius:4px;overflow:hidden;margin-bottom:20px}.progress i{display:block;height:100%;background:#fff;transition:.25s}.poster{height:300px;border-radius:22px;background:linear-gradient(145deg,#313643,#111319);display:flex;align-items:flex-end;padding:22px;position:relative;overflow:hidden;margin-bottom:16px}.poster:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 72% 18%,#626978 0,transparent 35%),linear-gradient(120deg,transparent,#0009)}.posterText{position:relative;z-index:1}.posterTitle{font-size:31px;font-weight:850;letter-spacing:-1px}.meta{color:#c8cad0;font-size:13px;margin-top:5px}.match{font-size:14px;font-weight:800;margin:12px 0}.why{color:#b5b8c0;font-size:14px;line-height:1.45}.provider{margin:14px 0;padding:13px;border:1px solid var(--line);border-radius:14px;background:#101217}.provider span{color:#9da1aa;font-size:13px}.section{margin:18px 0}.label{font-size:12px;color:#7f838c;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:9px}.footer{margin-top:auto;color:#666a73;text-align:center;font-size:10px;padding-top:18px;line-height:1.4}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#f4f4f6;color:#08090b;padding:12px 16px;border-radius:14px;font-size:13px;font-weight:700;box-shadow:0 8px 30px #0008;z-index:10}</style></head><body><div class="app"><div class="logo">MAX</div><div class="tag">Your personal movie concierge.</div><main id="root"></main></div><script>const catalog=[{t:"Game Night",y:2018,r:"1h 40m",g:["Comedy","Crime"],v:["funny","clever"],s:["Hulu","Max","Prime Video"],d:"Fast, clever, chaotic and easy to watch."},{t:"Knives Out",y:2019,r:"2h 10m",g:["Mystery","Comedy"],v:["hooked","clever","think"],s:["Netflix","Prime Video"],d:"A sharp mystery with a funny ensemble and plenty of twists."},{t:"The Nice Guys",y:2016,r:"1h 56m",g:["Comedy","Crime"],v:["funny","clever"],s:["Hulu","Prime Video"],d:"Buddy-cop chaos, dark humor and a quick pace."},{t:"Arrival",y:2016,r:"1h 56m",g:["Sci-Fi","Drama"],v:["think","feeling"],s:["Paramount+","Prime Video"],d:"Thoughtful sci-fi with mystery, emotion and a big idea."},{t:"About Time",y:2013,r:"2h 3m",g:["Romance","Comedy"],v:["feeling","funny"],s:["Netflix","Peacock"],d:"Warm, funny and unexpectedly emotional."},{t:"Hot Fuzz",y:2007,r:"2h 1m",g:["Comedy","Action"],v:["funny","clever","hooked"],s:["Peacock","Prime Video"],d:"Ridiculous, smart and packed with action."}];const state={i:0,a:{},services:[],taste:JSON.parse(localStorage.getItem("maxTaste")||"{}")};const root=document.getElementById("root");const questions=[["Movie or TV?",["🎬 Movie","📺 TV"],"type"],["What's the vibe?",["😂 Make me laugh","😮 Keep me hooked","🧠 Make me think","❤️ Something with feeling","😱 Freak me out","🎲 Surprise me"],"vibe"],["How much time have we got?",["Under 90 min","90–120 min","2+ hours","Don't care"],"time"],["Something you've seen before, or something new?",["Comfort pick","Something new","Surprise me"],"novelty"],["Where can I look?",["Netflix","Prime Video","Hulu","Disney+","Max","Paramount+","Peacock","Apple TV+","EVERYWHERE"],"services"]];function home(){root.innerHTML=`<section class="screen center"><div class="hero"><h1>What are we<br>watching?</h1><p>Stop scrolling. Start watching.</p></div><button class="primary" onclick="start()">🎙 Talk to MAX</button><button onclick="start()">🎲 MAX, PICK SOMETHING</button><div class="section"><div class="label">Tonight's vibe</div><div class="chips"><button onclick="quick('funny')">😂 Funny</button><button onclick="quick('hooked')">😮 Thriller</button><button onclick="quick('feeling')">❤️ Easy</button><button onclick="quick('surprise')">🎲 Surprise</button></div></div><div class="footer">MAX v0.2 · Taste memory enabled</div></section>`}function quick(v){start();state.a.vibe=v==="surprise"?"🎲 Surprise me":v==="funny"?"😂 Make me laugh":v==="hooked"?"😮 Keep me hooked":"❤️ Something with feeling";state.i=2;renderQ()}function start(){state.i=0;state.a={};state.services=[];renderQ()}function renderQ(){let q=questions[state.i],pct=(state.i+1)/questions.length*100;root.innerHTML=`<section class="screen"><div class="top"><button class="back" onclick="${state.i?'prev()':'home()'}">‹ Back</button><span style="color:#777b84;font-size:12px">${state.i+1} / ${questions.length}</span></div><div class="progress"><i style="width:${pct}%"></i></div><div class="q">${q[0]}</div><div class="sub">${state.i===4?"Pick as many as you want.":""}</div><div class="${state.i===1||state.i===4?'grid':''}" id="choices"></div><div class="footer">MAX learns from your choices.</div></section>`;let c=document.getElementById("choices");q[1].forEach(v=>{let b=document.createElement("button");b.textContent=v;if(state.i===4)b.onclick=()=>toggle(v,b);else b.onclick=()=>answer(v,q[2]);c.appendChild(b)});if(state.i===4){let b=document.createElement("button");b.className="primary";b.textContent="Find my pick";b.onclick=finish;c.appendChild(b)}}function answer(v,k){state.a[k]=v;state.i++;if(state.i<questions.length)renderQ();else finish()}function toggle(v,b){if(v==="EVERYWHERE"){state.services=["EVERYWHERE"];document.querySelectorAll("#choices button").forEach(x=>x.classList.remove("primary"));b.classList.add("primary");return}state.services=state.services.filter(x=>x!=="EVERYWHERE");b.classList.toggle("primary");if(b.classList.contains("primary"))state.services.push(v);else state.services=state.services.filter(x=>x!==v)}function prev(){state.i? (state.i--,renderQ()):home()}function vibeKey(){let v=state.a.vibe||"";return v.includes("laugh")?"funny":v.includes("hooked")?"hooked":v.includes("think")?"think":v.includes("feeling")?"feeling":v.includes("freak")?"scary":"clever"}function pick(){let key=vibeKey(),services=state.services.includes("EVERYWHERE")?null:state.services;let candidates=catalog.filter(m=>!services||m.s.some(x=>services.includes(x)));if(!candidates.length)candidates=catalog;let scored=candidates.map(m=>{let score=60+(m.v.includes(key)?22:0)+(m.g.some(g=>Object.keys(state.taste).some(k=>k===g&&state.taste[k]>0))?8:0);return {...m,score:Math.min(98,score)}});scored.sort((a,b)=>b.score-a.score);return scored[0]}function finish(){let m=pick();state.current=m;root.innerHTML=`<section class="screen"><div class="top"><button class="back" onclick="home()">‹ Home</button><span style="color:#777b84;font-size:12px">MAX'S PICK</span></div><div class="poster"><div class="posterText"><div class="posterTitle">${m.t}</div><div class="meta">${m.y} · ${m.r} · ${m.g.join(" / ")}</div></div></div><div class="match">✦ ${m.score}% MAX MATCH</div><div class="why">“${m.d} I'm not giving you 40 choices. I'm picking one.”</div><div class="provider"><b>Where to watch</b><br><span>${m.s.join(" · ")}</span></div><button class="primary" onclick="watch()">▶ WATCH NOW</button><button onclick="retry()">NOPE — TRY AGAIN</button><div class="chips"><button onclick="feedback('loved')">❤️ Loved it</button><button onclick="feedback('liked')">👍 Liked it</button><button onclick="feedback('meh')">😐 Meh</button><button onclick="feedback('nope')">👎 Nope</button></div><div class="footer" id="note">MAX v0.2 · Demo catalog. Live provider data comes next.</div></section>`}function retry(){state.taste[state.current.g[0]]=(state.taste[state.current.g[0]]||0)-1;save();finish()}function feedback(x){let m=state.current;let delta=x==="loved"?3:x==="liked"?1:x==="nope"?-3:0;m.g.forEach(g=>state.taste[g]=(state.taste[g]||0)+delta);save();document.getElementById("note").textContent=x==="loved"?"MAX remembers. Your taste profile just got smarter.":x==="nope"?"Got it. MAX will steer away from this kind of thing.":"Noted. MAX is learning."}function save(){localStorage.setItem("maxTaste",JSON.stringify(state.taste))}function watch(){toast("Watch action is ready for real provider deep-links.")}function toast(t){let x=document.createElement("div");x.className="toast";x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}home();</script></body></html>

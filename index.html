<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07080b"><title>MAX — Your Personal Movie Concierge</title><style>:root{--bg:#07080b;--card:#15171c;--line:#2a2d35;--text:#f7f7f8;--muted:#9da1aa}*{box-sizing:border-box}body{margin:0;background:#020305;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;padding:18px;background:radial-gradient(circle at 50% -10%,#292e39,#0b0c10 35%,#050609 75%)}.logo{text-align:center;font-weight:850;letter-spacing:8px;font-size:22px;margin:8px 0 3px}.tag{text-align:center;color:var(--muted);font-size:12px}.screen{min-height:calc(100vh - 70px);display:flex;flex-direction:column}.center{justify-content:center}.hero{text-align:center;margin:auto 0 24px}.hero h1{font-size:35px;line-height:1.04;margin:0 0 12px}.hero p,.muted{color:var(--muted)}button{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:16px;padding:15px;font-size:16px;font-weight:650;margin:6px 0}button.primary{background:#f5f5f7;color:#08090b}.small{font-size:13px;padding:11px}.top{display:flex;justify-content:space-between;align-items:center;margin:18px 0}.back{width:auto;border:0;background:none;padding:4px;color:var(--muted);margin:0}.q{font-size:28px;line-height:1.08;margin:12px 0 18px}.progress{height:3px;background:#24262d;margin-bottom:18px}.progress i{display:block;height:100%;background:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid button{margin:0}.chips{display:flex;flex-wrap:wrap;gap:7px}.chips button{width:auto;margin:0;padding:10px 13px;border-radius:999px;font-size:13px}.section{margin:18px 0}.label{font-size:11px;color:#7f838c;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:9px}.search{display:flex;gap:8px}.search input{flex:1;min-width:0;border:1px solid var(--line);background:#101217;color:white;border-radius:14px;padding:14px;font-size:15px}.search button{width:auto;margin:0}.card{border:1px solid var(--line);background:#101217;border-radius:18px;padding:12px;margin:9px 0;display:flex;gap:12px}.thumb{width:72px;height:108px;border-radius:10px;background:#272a31;object-fit:cover}.card h3{margin:2px 0 6px}.poster{height:320px;border-radius:22px;background:linear-gradient(145deg,#313643,#111319);display:flex;align-items:flex-end;padding:22px;position:relative;overflow:hidden}.poster:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,#000d)}.posterText{position:relative;z-index:1}.posterTitle{font-size:31px;font-weight:850}.provider{margin:14px 0;padding:13px;border:1px solid var(--line);border-radius:14px;background:#101217}.footer{margin-top:auto;color:#666a73;text-align:center;font-size:10px;padding-top:18px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#f4f4f6;color:#08090b;padding:12px 16px;border-radius:14px;font-size:13px;font-weight:700;z-index:10;max-width:90%;text-align:center}</style></head><body><div class="app"><div class="logo">MAX</div><div class="tag">Your personal movie concierge.</div><main id="root"></main></div><script>
const demo=[['Game Night','2018','Comedy · Crime','Fast, clever, chaotic and easy to watch.'],['Knives Out','2019','Mystery · Comedy','A sharp mystery with a funny ensemble and plenty of twists.'],['The Nice Guys','2016','Comedy · Crime','Buddy-cop chaos, dark humor and a quick pace.'],['Arrival','2016','Sci-Fi · Drama','Thoughtful sci-fi with mystery, emotion and a big idea.'],['About Time','2013','Romance · Comedy','Warm, funny and unexpectedly emotional.'],['Hot Fuzz','2007','Comedy · Action','Ridiculous, smart and packed with action.']];const state={i:0,a:{},services:[],taste:JSON.parse(localStorage.getItem('maxTaste')||'{}'),current:null};const root=document.getElementById('root');const qs=[['Movie or TV?',['🎬 Movie','📺 TV'],'type'],["What's the vibe?",['😂 Make me laugh','😮 Keep me hooked','🧠 Make me think','❤️ Something with feeling','😱 Freak me out','🎲 Surprise me'],'vibe'],['How much time have we got?',['Under 90 min','90–120 min','2+ hours',"Don't care"],'time'],['Something familiar or something new?',['Comfort pick','Something new','Surprise me'],'novelty'],['Where can I look?',['Netflix','Prime Video','Hulu','Disney+','Max','Paramount+','Peacock','Apple TV+','EVERYWHERE'],'services']];
function home(){root.innerHTML=`<section class="screen center"><div class="hero"><h1>What are we<br>watching?</h1><p>Stop scrolling. Start watching.</p></div><button class="primary" onclick="start()">🎙 Talk to MAX</button><button onclick="start()">🎲 MAX, PICK SOMETHING</button><div class="section"><div class="label">Search the MAX universe</div><div class="search"><input id="search" placeholder="Movie, show, actor…"><button class="primary" onclick="search()">Search</button></div><div class="chips"><button onclick="quick('funny')">😂 Funny</button><button onclick="quick('hooked')">😮 Thriller</button><button onclick="quick('feeling')">❤️ Easy</button><button onclick="quick('surprise')">🎲 Surprise</button></div></div><button class="small" onclick="settings()">⚙️ MAX Settings</button><div class="footer">MAX v0.4 · concierge framework</div></section>`}
function start(){state.i=0;state.a={};state.services=[];q()}function quick(v){start();state.a.vibe=v;state.i=2;q()}function q(){let x=qs[state.i],p=(state.i+1)/qs.length*100;root.innerHTML=`<section class="screen"><div class="top"><button class="back" onclick="${state.i?'prev()':'home()'}">‹ Back</button><span class="muted">${state.i+1} / ${qs.length}</span></div><div class="progress"><i style="width:${p}%"></i></div><div class="q">${x[0]}</div><div class="${state.i===1||state.i===4?'grid':''}" id="c"></div><div class="footer">MAX learns from your choices.</div></section>`;x[1].forEach(v=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>{if(state.i===4){b.classList.toggle('primary');if(v==='EVERYWHERE')state.services=['EVERYWHERE'];else{state.services=state.services.filter(x=>x!=='EVERYWHERE');state.services.includes(v)?state.services=state.services.filter(x=>x!==v):state.services.push(v)}}else{state.a[x[2]]=v;state.i++;state.i<qs.length?q():finish()}};c.appendChild(b)});if(state.i===4){let b=document.createElement('button');b.className='primary';b.textContent='Find my pick';b.onclick=finish;c.appendChild(b)}}function prev(){state.i?(state.i--,q()):home()}
function finish(){let m=choose();state.current=m;detail(m)}function choose(){let key=state.a.vibe||'';let pool=demo.filter(m=>!state.services.length||state.services.includes('EVERYWHERE')||m[3].toLowerCase().includes(key.includes('laugh')?'funny':key.includes('think')?'think':''));return pool[Math.floor(Math.random()*pool.length)]||demo[0]}function detail(m){root.innerHTML=`<section class="screen"><div class="top"><button class="back" onclick="home()">‹ Home</button><span class="muted">MAX'S PICK</span></div><div class="poster"><div class="posterText"><div class="posterTitle">${m[0]}</div><div class="muted">${m[1]} · ${m[2]}</div></div></div><b>✦ 91% MAX MATCH</b><p class="muted">“${m[3]} I'm not giving you 40 choices. I'm picking one.”</p><div class="provider"><b>Where to watch</b><br><span class="muted">Live provider availability is the next connection.</span></div><button class="primary" onclick="toast('Watch links arrive with the streaming-data connection.')">▶ WATCH NOW</button><button onclick="finish()">NOPE — TRY AGAIN</button><div class="chips"><button onclick="feedback(3)">❤️ Loved it</button><button onclick="feedback(1)">👍 Liked it</button><button onclick="feedback(0)">😐 Meh</button><button onclick="feedback(-3)">👎 Nope</button></div><div class="footer">MAX v0.4 · Learning engine active</div></section>`}function feedback(n){let g=state.current[2];state.taste[g]=(state.taste[g]||0)+n;localStorage.setItem('maxTaste',JSON.stringify(state.taste));toast(n<0?'Got it. MAX will steer away from this.':'Noted. MAX is learning.')}
function search(){let term=document.getElementById('search').value.trim();if(!term)return;root.innerHTML=`<section class="screen"><div class="top"><button class="back" onclick="home()">‹ Home</button><span class="muted">SEARCH</span></div><div class="q">Results for “${esc(term)}”</div>${demo.map(m=>`<div class="card" onclick="detail(${JSON.stringify(m).replace(/"/g,'&quot;')})"><div><h3>${m[0]}</h3><div class="muted">${m[1]} · ${m[2]}</div><p class="muted">${m[3]}</p></div></div>`).join('')}<div class="footer">Live catalog connection is the next backend milestone.</div></section>`}
function settings(){root.innerHTML=`<section class="screen"><div class="top"><button class="back" onclick="home()">‹ Home</button><span class="muted">SETTINGS</span></div><div class="q">MAX is ready for real data.</div><p class="muted">v0.4 separates the MAX experience from the data layer. That lets us connect movie metadata and streaming availability securely in the next build instead of exposing credentials in a public web app.</p><div class="provider"><b>Next integrations</b><br><span class="muted">TMDB metadata · streaming provider availability · secure backend · real watch links</span></div><button onclick="localStorage.removeItem('maxTaste');state.taste={};toast('Taste memory cleared.')">Clear MAX taste memory</button><div class="footer">MAX v0.4</div></section>`}function esc(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2300)}home();</script></body></html>

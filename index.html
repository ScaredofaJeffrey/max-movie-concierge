<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07080b"><title>MAX — Movie Concierge</title><style>body{margin:0;background:#07080b;color:#f7f7f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;padding:20px 18px;background:radial-gradient(circle at 50% -10%,#292e39,#050609 65%)}.logo{text-align:center;font-weight:900;letter-spacing:8px;font-size:22px}.tag{text-align:center;color:#9da1aa;font-size:12px}.screen{min-height:calc(100vh - 70px);display:flex;flex-direction:column;justify-content:center}.hero{text-align:center;margin-bottom:25px}.hero h1{font-size:35px;line-height:1.05;margin:0 0 12px}.hero p{color:#9da1aa}.link{display:block;width:100%;padding:16px;margin:6px 0;border-radius:16px;border:1px solid #2a2d35;background:#15171c;color:#fff;font-size:16px;font-weight:650;text-decoration:none;text-align:center;box-sizing:border-box}.primary{background:#f5f5f7;color:#08090b}.small{color:#666a73;font-size:10px;text-align:center;margin-top:22px}.savedBox{padding:14px;border:1px solid #2a2d35;border-radius:16px;background:#101217;margin-top:8px}.savedRow{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;padding:7px 0}.savedRow img{width:38px;height:54px;object-fit:cover;border-radius:6px}.savedTitle{font-size:13px;font-weight:700}.savedReason{font-size:10px;color:#9da1aa;margin-top:3px}</style></head><body><div class="app"><div class="logo">MAX</div><div class="tag">Your personal movie concierge.</div><section class="screen"><div class="hero"><h1>What are we<br>watching?</h1><p>Stop scrolling. Start watching.</p></div><a class="link primary" href="./pick.html?v=084">🎲 MAX, PICK SOMETHING</a><a class="link" href="./search.html?v=084">🔎 Search the MAX universe</a><div id="saved"></div><a class="link" href="./settings.html?v=084">⚙️ MAX Settings</a><div class="small">MAX v0.8.4 · saved-for-later shelf</div></section></div><script>(function(){const box=document.getElementById('saved'),items=JSON.parse(localStorage.getItem('maxLater')||'[]').slice().reverse();if(!items.length)return;const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));box.innerHTML='<div class="savedBox"><div class="savedTitle">🕐 Maybe Later <span class="savedReason">· '+items.length+' saved</span></div>'+items.slice(0,3).map(x=>'<a class="savedRow" href="./detail.html?id='+encodeURIComponent(x.id)+'&type='+encodeURIComponent(x.type||'movie')+'">'+(x.poster_path?'<img src="https://image.tmdb.org/t/p/w92'+x.poster_path+'">':'')+'<div><div class="savedTitle">'+safe(x.title||'Untitled')+'</div><div class="savedReason">'+(x.reason==='not-today'?'🌙 Not today':'🕐 Maybe another time')+'</div></div></a>').join('')+'<a class="savedRow" href="./saved.html?v=084"><div class="savedTitle">View all saved →</div></a></div>'})();</script></body></html>

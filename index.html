<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07080b"><title>MAX — Movie Concierge</title><style>body{margin:0;background:#07080b;color:#f7f7f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;padding:20px 18px;background:radial-gradient(circle at 50% -10%,#292e39,#050609 65%)}.logo{text-align:center;font-weight:900;letter-spacing:8px;font-size:22px}.tag{text-align:center;color:#9da1aa;font-size:12px}.screen{min-height:calc(100vh - 70px);display:flex;flex-direction:column}.center{justify-content:center}.hero{text-align:center;margin:auto 0 25px}.hero h1{font-size:35px;line-height:1.05;margin:0 0 12px}.hero p,.small{color:#9da1aa;line-height:1.45}.top{display:flex;justify-content:space-between;align-items:center;margin:20px 0}.back{width:auto!important;background:none!important;border:0!important;color:#9da1aa!important;padding:4px!important}button{width:100%;padding:16px;margin:6px 0;border-radius:16px;border:1px solid #2a2d35;background:#15171c;color:#fff;font-size:16px;font-weight:650;cursor:pointer}button.primary{background:#f5f5f7;color:#08090b}.input{width:100%;padding:14px;border-radius:14px;border:1px solid #2a2d35;background:#101217;color:white;font-size:16px;box-sizing:border-box}.poster{width:100%;max-height:430px;object-fit:cover;border-radius:14px;margin:10px 0}.card{padding:16px;border:1px solid #2a2d35;border-radius:18px;background:#101217}.title{font-size:28px;font-weight:850}.muted{color:#9da1aa;font-size:13px}.status{padding:13px;border:1px solid #2a2d35;border-radius:14px;margin:10px 0;background:#101217;font-size:13px}.results button{text-align:left}</style></head><body><div class="app"><div class="logo">MAX</div><div class="tag">Your personal movie concierge.</div><main id="root"></main></div><script>(function(){'use strict';const root=document.getElementById('root'),API='https://api.themoviedb.org/3',IMG='https://image.tmdb.org/t/p/w500';let current=null;const token=()=>localStorage.getItem('maxTmdbToken')||'';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,tok=token()){if(!tok)throw Error('TMDB is not connected.');const r=await fetch(API+path,{headers:{Authorization:'Bearer '+tok}});if(!r.ok)throw Error('TMDB returned '+r.status);return r.json()}function home(){root.innerHTML='<section class="screen center"><div class="hero"><h1>What are we<br>watching?</h1><p>Stop scrolling. Start watching.</p></div><button class="primary" data-a="pick">🎲 MAX, PICK SOMETHING</button><button data-a="search">🔎 Search the MAX universe</button><button data-a="settings">⚙️ MAX Settings</button><div class="small" style="text-align:center;margin-top:25px">MAX v0.7.4 · stable navigation build</div></section>'}function settings(){root.innerHTML='<section class="screen"><div class="top"><button data-a="home" class="back">‹ Home</button><span class="small">SETTINGS</span></div><div class="hero"><h1>TMDB</h1><p>Connect your existing TMDB token.</p></div><input class="input" id="tmdb" type="password" placeholder="TMDB Read Access Token" value="'+esc(token())+'"><button class="primary" data-a="save">Save & Test TMDB</button><div id="msg" class="small"></div></section>'}async function save(){const v=document.getElementById('tmdb')?.value.trim(),m=document.getElementById('msg');if(!v){if(m)m.textContent='Paste your TMDB Read Access Token.';return}if(m)m.textContent='Testing TMDB…';try{await api('/configuration',v);localStorage.setItem('maxTmdbToken',v);if(m)m.textContent='TMDB connected.';setTimeout(home,500)}catch(e){if(m)m.textContent=e.message}}function search(){root.innerHTML='<section class="screen"><div class="top"><button data-a="home" class="back">‹ Home</button><span class="small">SEARCH</span></div><div class="hero"><h1>Search MAX</h1><p>Find a movie or show directly.</p></div><form id="sf"><input class="input" id="query" name="query" enterkeyhint="search" autocomplete="off" placeholder="Movie, show, actor, director..."><button class="primary" type="submit">Search</button></form><div id="results" class="results"></div></section>';document.getElementById('sf').addEventListener('submit',e=>{e.preventDefault();doSearch()});setTimeout(()=>document.getElementById('query')?.focus(),0)}async function doSearch(){const q=(document.getElementById('query')?.value||'').trim(),out=document.getElementById('results');if(!q)return;if(!token()){out.innerHTML='<div class="status">Connect TMDB in Settings first.</div>';return}out.innerHTML='<p class="small">MAX is searching…</p>';try{const d=await api('/search/multi?query='+encodeURIComponent(q)+'&include_adult=false&language=en-US&page=1'),items=(d.results||[]).filter(x=>x.media_type==='movie'||x.media_type==='tv').slice(0,10);out.innerHTML='';if(!items.length){out.innerHTML='<p class="small">MAX couldn’t find that.</p>';return}items.forEach(x=>{const b=document.createElement('button');b.type='button';b.dataset.a='show';b.dataset.id=x.id;b.dataset.type=x.media_type;b.innerHTML=esc(x.title||x.name)+' <span class="muted">· '+(x.media_type==='tv'?'TV':'Movie')+'</span>';out.appendChild(b)})}catch(e){out.innerHTML='<div class="status">'+esc(e.message)+'</div>'}}async function show(id,type){try{root.innerHTML='<section class="screen center"><div class="hero"><h1>MAX is thinking…</h1><p>Loading your selection.</p></div></section>';const x=await api('/'+type+'/'+id+'?language=en-US');current={...x,id,type,title:x.title||x.name};detail(current)}catch(e){root.innerHTML='<section class="screen center"><div class="hero"><h1>MAX hit a snag.</h1><p>'+esc(e.message)+'</p></div><button class="primary" data-a="search">Back to Search</button><button data-a="home">Back to MAX</button></section>'}}function detail(x){root.innerHTML='<section class="screen"><div class="top"><button data-a="home" class="back">‹ Home</button><span class="small">MAX PICK</span></div><div class="card">'+(x.poster_path?'<img class="poster" src="'+IMG+x.poster_path+'">':'')+'<div class="title">'+esc(x.title)+'</div><p class="muted">'+esc((x.release_date||x.first_air_date||'').slice(0,4))+' · TMDB '+(x.vote_average?x.vote_average.toFixed(1):'—')+'/10</p><p class="small">'+esc(x.overview||'MAX found this for you.')+'</p></div><button class="primary" data-a="search">🔎 Find another</button><button data-a="home">← Back to MAX</button></section>'}async function pick(){if(!token()){settings();return}root.innerHTML='<section class="screen center"><div class="hero"><h1>MAX is thinking…</h1><p>Finding something worth watching.</p></div></section>';try{const d=await api('/discover/movie?language=en-US&region=US&include_adult=false&include_video=false&sort_by=popularity.desc&vote_count.gte=250&page=1'),blocked=new Set(JSON.parse(localStorage.getItem('maxRejected')||'[]').map(Number)),items=(d.results||[]).filter(x=>!blocked.has(Number(x.id)));if(!items.length)throw Error('No available recommendations right now.');const x=items[Math.floor(Math.random()*Math.min(items.length,20))];current={...x,id:x.id,type:'movie',title:x.title};detail(current)}catch(e){root.innerHTML='<section class="screen center"><div class="hero"><h1>MAX hit a snag.</h1><p>'+esc(e.message)+'</p></div><button class="primary" data-a="settings">Check TMDB</button><button data-a="home">Back to MAX</button></section>'}}document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;if(a==='home')home();else if(a==='search')search();else if(a==='settings')settings();else if(a==='save')save();else if(a==='pick')pick();else if(a==='show')show(b.dataset.id,b.dataset.type)});home()})();</script></body></html>

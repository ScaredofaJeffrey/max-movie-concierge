<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07080b"><title>MAX</title><style>body{margin:0;background:#07080b;color:#f7f7f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;padding:20px 18px;background:radial-gradient(circle at 50% -10%,#292e39,#050609 65%)}.logo{text-align:center;font-weight:900;letter-spacing:8px;font-size:22px}.tag{text-align:center;color:#9da1aa;font-size:12px}.screen{min-height:calc(100vh - 70px);display:flex;flex-direction:column}.center{justify-content:center}.hero{text-align:center;margin:auto 0 25px}.hero h1{font-size:35px;line-height:1.05;margin:0 0 12px}.hero p,.small{color:#9da1aa}.top{display:flex;justify-content:space-between;align-items:center;margin:20px 0}.back{width:auto!important;background:none!important;border:0!important;color:#9da1aa!important;padding:4px!important}button{width:100%;padding:16px;margin:6px 0;border-radius:16px;border:1px solid #2a2d35;background:#15171c;color:#fff;font-size:16px;font-weight:650}button.primary{background:#f5f5f7;color:#08090b}.input{width:100%;padding:14px;border-radius:14px;border:1px solid #2a2d35;background:#101217;color:white;font-size:16px;box-sizing:border-box}</style></head><body><div class="app"><div class="logo">MAX</div><div class="tag">Your personal movie concierge.</div><main id="root"><section class="screen center"><div class="hero"><h1>What are we<br>watching?</h1><p>Stop scrolling. Start watching.</p></div><button class="primary" id="pick">🎲 MAX, PICK SOMETHING</button><button id="search">🔎 Search the MAX universe</button><button id="settings">⚙️ MAX Settings</button><div class="small" style="text-align:center;margin-top:25px">MAX stable recovery build · v0.7.1</div></section></main></div><script>(function(){const r=document.getElementById('root'),A='https://api.themoviedb.org/3';function token(){return localStorage.getItem('maxTmdbToken')||''}function settings(){r.innerHTML='<section class="screen"><div class="top"><button class="back" onclick="location.reload()">‹ Home</button></div><div class="hero"><h1>TMDB</h1><p>Connect your existing TMDB token.</p></div><input class="input" id="tmdb" type="password" placeholder="TMDB Read Access Token" value="'+token()+'"><button class="primary" id="save">Save & Test TMDB</button></section>';document.getElementById('save').onclick=async function(){let t=document.getElementById('tmdb').value.trim();if(!t)return;try{let x=await fetch(A+'/configuration',{headers:{Authorization:'Bearer '+t}});if(!x.ok)throw Error();localStorage.setItem('maxTmdbToken',t);alert('TMDB connected.');location.reload()}catch(e){alert('Token failed. Your existing token was not changed.')}}}function search(){r.innerHTML='<section class="screen"><div class="top"><button class="back" onclick="location.reload()">‹ Home</button><span class="small">SEARCH</span></div><div class="hero"><h1>Search MAX</h1><p>Find a movie or show directly.</p></div><form id="sf"><input class="input" id="q" enterkeyhint="search" autocomplete="off" placeholder="Movie, show, actor, director..."><button class="primary" type="submit">Search</button></form><div id="results"></div></section>';document.getElementById('sf').addEventListener('submit',async function(e){e.preventDefault();let q=document.getElementById('q').value.trim(),out=document.getElementById('results');if(!q)return;out.innerHTML='<p class="small">MAX is searching…</p>';try{let x=await fetch(A+'/search/multi?query='+encodeURIComponent(q)+'&include_adult=false&language=en-US&page=1',{headers:{Authorization:'Bearer '+token()}});if(!x.ok)throw Error();let d=await x.json(),items=(d.results||[]).filter(x=>x.media_type==='movie'||x.media_type==='tv').slice(0,10);out.innerHTML=items.length?items.map(x=>'<button type="button">'+(x.title||x.name)+'</button>').join(''):'<p class="small">MAX couldn’t find that.</p>'}catch(e){out.innerHTML='<p class="small">Search needs a valid TMDB connection. Open Settings if needed.</p>'}});document.getElementById('q').focus()}function pick(){if(!token()){settings();return}r.innerHTML='<section class="screen center"><div class="hero"><h1>MAX is thinking…</h1><p>Core recovery build is connected to TMDB.</p></div><button class="primary" onclick="location.reload()">Back to MAX</button></section>'}document.getElementById('search').onclick=search;document.getElementById('settings').onclick=settings;document.getElementById('pick').onclick=pick})();</script></body></html>

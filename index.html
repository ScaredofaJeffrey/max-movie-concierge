<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07080b"><title>MAX — Movie Concierge</title><style>:root{--bg:#07080b;--card:#15171c;--line:#2a2d35;--muted:#9da1aa;--text:#f7f7f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;padding:20px 18px;background:radial-gradient(circle at 50% -10%,#292e39,#050609 65%)}.logo{text-align:center;font-weight:900;letter-spacing:8px;font-size:22px}.tag{text-align:center;color:var(--muted);font-size:12px}.screen{min-height:calc(100vh - 70px);display:flex;flex-direction:column}.center{justify-content:center}.hero{text-align:center;margin:auto 0 25px}.hero h1{font-size:35px;line-height:1.05;margin:0 0 12px}.hero p,.small{color:var(--muted);line-height:1.45}.top{display:flex;justify-content:space-between;align-items:center;margin:20px 0}.back{width:auto!important;background:none!important;border:0!important;color:var(--muted)!important;padding:4px!important;text-decoration:none}button,.linkBtn{display:block;width:100%;padding:16px;margin:6px 0;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:16px;font-weight:650;cursor:pointer;text-align:center;text-decoration:none}.primary{background:#f5f5f7!important;color:#08090b!important}.input{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:#101217;color:#fff;font-size:16px}.poster{width:100%;max-height:430px;object-fit:cover;border-radius:14px;margin:0 0 12px}.card{padding:16px;border:1px solid var(--line);border-radius:18px;background:#101217}.title{font-size:28px;font-weight:850}.muted{color:var(--muted);font-size:13px}.status{padding:13px;border:1px solid var(--line);border-radius:14px;background:#101217;margin-top:10px}.results a{text-align:left}</style></head><body><div class="app"><div class="logo">MAX</div><div class="tag">Your personal movie concierge.</div><main id="root"></main></div><script>(function(){'use strict';const root=document.getElementById('root'),API='https://api.themoviedb.org/3',IMG='https://image.tmdb.org/t/p/w500';let current=null;const token=()=>localStorage.getItem('maxTmdbToken')||'';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,tok=token()){if(!tok)throw Error('TMDB is not connected. Open Settings.');const r=await fetch(API+path,{headers:{Authorization:'Bearer '+tok}});if(!r.ok)throw Error('TMDB returned '+r.status);return r.json()}function home(){location.href='?screen=home'}function renderHome(){root.innerHTML='<section class="screen center"><div class="hero"><h1>What are we<br>watching?</h1><p>Stop scrolling. Start watching.</p></div><a class="linkBtn primary" href="?screen=pick">🎲 MAX, PICK SOMETHING</a><a class="linkBtn" href="?screen=search">🔎 Search the MAX universe</a><a class="linkBtn" href="?screen=settings">⚙️ MAX Settings</a><div class="small" style="text-align:center;margin-top:25px">MAX v0.7.6 · native secondary navigation</div></section>'}function settings(){root.innerHTML='<section class="screen"><div class="top"><a class="back" href="?screen=home">‹ Home</a><span class="small">SETTINGS</span></div><div class="hero"><h1>TMDB</h1><p>Connect your existing TMDB Read Access Token.</p></div><input class="input" id="tmdb" type="password" placeholder="TMDB Read Access Token" value="'+esc(token())+'"><button class="primary" id="save">Save & Test TMDB</button><div id="msg" class="small"></div></section>';document.getElementById('save').onclick=async()=>{const v=document.getElementById('tmdb').value.trim(),m=document.getElementById('msg');if(!v){m.textContent='Paste your TMDB token first.';return}m.textContent='Testing TMDB…';try{await api('/configuration',v);localStorage.setItem('maxTmdbToken',v);m.textContent='TMDB connected.';setTimeout(()=>{location.href='?screen=home'},500)}catch(e){m.textContent=e.message}}}function search(){root.innerHTML='<section class="screen"><div class="top"><a class="back" href="?screen=home">‹ Home</a><span class="small">SEARCH</span></div><div class="hero"><h1>Search MAX</h1><p>Find a movie or show directly.</p></div><form id="sf" action="?screen=search" method="get"><input type="hidden" name="screen" value="search"><input class="input" id="q" name="q" enterkeyhint="search" autocomplete="off" placeholder="Movie, show, actor, director..."><button class="primary" type="submit">Search</button></form><div id="results" class="results"></div></section>';const form=document.getElementById('sf');form.addEventListener('submit',e=>{e.preventDefault();doSearch(document.getElementById('q').value)});const params=new URLSearchParams(location.search),q=params.get('q');if(q){document.getElementById('q').value=q;doSearch(q)}setTimeout(()=>document.getElementById('q')?.focus(),0)}async function doSearch(q){q=(q||'').trim();const out=document.getElementById('results');if(!q)return;if(!token()){out.innerHTML='<div class="status">Connect TMDB in Settings first.</div>';return}out.innerHTML='<p class="small">MAX is searching…</p>';try{const d=await api('/search/multi?query='+encodeURIComponent(q)+'&include_adult=false&language=en-US&page=1'),items=(d.results||[]).filter(x=>x.media_type==='movie'||x.media_type==='tv').slice(0,10);out.innerHTML='';if(!items.length){out.innerHTML='<p class="small">MAX couldn’t find that.</p>';return}items.forEach(x=>{const a=document.createElement('a');a.className='linkBtn';a.href='?screen=detail&id='+x.id+'&type='+x.media_type;a.textContent=(x.title||x.name)+' · '+(x.media_type==='tv'?'TV':'Movie');out.appendChild(a)})}catch(e){out.innerHTML='<div class="status">'+esc(e.message)+'</div>'}}async function detail(id,type){try{const x=await api('/'+type+'/'+id+'?language=en-US');current={...x,id,type,title:x.title||x.name};root.innerHTML='<section class="screen"><div class="top"><a class="back" href="?screen=home">‹ Home</a><span class="small">MAX PICK</span></div><div class="card">'+(current.poster_path?'<img class="poster" src="'+IMG+current.poster_path+'">':'')+'<div class="title">'+esc(current.title)+'</div><p class="muted">'+esc((current.release_date||current.first_air_date||'').slice(0,4))+' · TMDB '+(current.vote_average?current.vote_average.toFixed(1):'—')+'/10</p><p class="small">'+esc(current.overview||'MAX found this for you.')+'</p></div><a class="linkBtn primary" href="?screen=search">🔎 Find another</a><a class="linkBtn" href="?screen=home">← Back to MAX</a></section>'}catch(e){root.innerHTML='<section class="screen center"><div class="hero"><h1>MAX hit a snag.</h1><p>'+esc(e.message)+'</p></div><a class="linkBtn primary" href="?screen=search">Back to Search</a><a class="linkBtn" href="?screen=home">Back to MAX</a></section>'}}async function pick(){if(!token()){settings();return}root.innerHTML='<section class="screen center"><div class="hero"><h1>MAX is thinking…</h1><p>Finding something worth watching.</p></div></section>';try{const d=await api('/discover/movie?language=en-US&region=US&include_adult=false&include_video=false&sort_by=popularity.desc&vote_count.gte=250&page=1'),blocked=new Set(JSON.parse(localStorage.getItem('maxRejected')||'[]').map(Number)),items=(d.results||[]).filter(x=>!blocked.has(Number(x.id)));if(!items.length)throw Error('No recommendations are available right now.');const x=items[Math.floor(Math.random()*Math.min(items.length,20))];location.href='?screen=detail&id='+x.id+'&type=movie'}catch(e){root.innerHTML='<section class="screen center"><div class="hero"><h1>MAX hit a snag.</h1><p>'+esc(e.message)+'</p></div><a class="linkBtn primary" href="?screen=settings">Check TMDB</a><a class="linkBtn" href="?screen=home">Back to MAX</a></section>'}}const params=new URLSearchParams(location.search),screen=params.get('screen');if(screen==='search')search();else if(screen==='settings')settings();else if(screen==='pick')pick();else if(screen==='detail'){const id=params.get('id'),type=params.get('type')||'movie';if(id)detail(id,type);else renderHome()}else renderHome()})();</script></body></html>

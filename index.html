<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAX</title><style>body{margin:0;background:#07080b;color:#f7f7f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;padding:20px 18px;background:radial-gradient(circle at 50% -10%,#292e39,#050609 65%)}.logo{text-align:center;font-weight:850;letter-spacing:8px;font-size:22px}.tag{text-align:center;color:#9da1aa;font-size:12px}.screen{min-height:calc(100vh - 70px);display:flex;flex-direction:column}.center{justify-content:center}.hero{text-align:center;margin:auto 0 25px}.hero h1{font-size:35px;line-height:1.05}.hero p,.small{color:#9da1aa}.top{display:flex;justify-content:space-between;align-items:center;margin:20px 0}.back{width:auto!important;background:none!important;border:0!important;color:#9da1aa!important;padding:4px!important}button{width:100%;padding:16px;margin:6px 0;border-radius:16px;border:1px solid #2a2d35;background:#15171c;color:#fff;font-size:16px;font-weight:650}button.primary{background:#f5f5f7;color:#08090b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid button{margin:0}.selected{background:#f5f5f7!important;color:#08090b!important}.chips{display:flex;flex-wrap:wrap;gap:7px}.chips button{width:auto;padding:10px 13px;border-radius:999px}.q{font-size:28px;line-height:1.1;margin:8px 0 20px}.footer{margin-top:auto;text-align:center;color:#666a73;font-size:10px;padding:20px}.input{width:100%;padding:14px;border-radius:14px;border:1px solid #2a2d35;background:#101217;color:white;font-size:15px;box-sizing:border-box}.poster{height:300px;border-radius:22px;background:#15171c;overflow:hidden;position:relative;margin-bottom:16px}.poster img{width:100%;height:100%;object-fit:cover}.poster div{position:absolute;bottom:0;padding:22px;width:100%;background:linear-gradient(transparent,#000);box-sizing:border-box}.title{font-size:30px;font-weight:850}.muted{color:#9da1aa;font-size:13px}.provider,.status{padding:13px;border:1px solid #2a2d35;border-radius:14px;margin:10px 0;background:#101217;font-size:13px}.savedCard{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid #2a2d35;border-radius:15px;margin:7px 0;background:#101217}.savedCard img{width:48px;height:70px;object-fit:cover;border-radius:8px}.savedCard b{font-size:14px}.savedCard span{display:block;color:#8f939c;font-size:11px;margin-top:4px}</style></head><body><div class="app"><div class="logo">MAX</div><div class="tag">Your personal movie concierge.</div><main id="root"></main></div><script>const API='https://api.themoviedb.org/3',IMG='https://image.tmdb.org/t/p/w342';let s={i:0,a:{},services:[],current:null};const root=document.getElementById('root'),tok=()=>localStorage.getItem('maxTmdbToken')||'';const qs=[['Movie or TV?',['🎬 Movie','📺 TV'],'type'],["What's the vibe?",['😂 Make me laugh','😮 Keep me hooked','🧠 Make me think','❤️ Something with feeling','😱 Freak me out','🎲 Surprise me'],'vibe'],['How much time have we got?',['Under 90 min','90–120 min','2+ hours',"Don't care"],'time'],['Something you\'ve seen before, or something new?',['Comfort pick','Something new','Surprise me'],'novelty'],['Where can I look?',['Netflix','Prime Video','Hulu','Disney+','Max','Paramount+','Peacock','Apple TV+','EVERYWHERE'],'services']];function laterList(){return JSON.parse(localStorage.getItem('maxLater')||'[]')}function saveLater(a){localStorage.setItem('maxLater',JSON.stringify(a))}function home(){let n=laterList().length;root.innerHTML='<section class="screen center"><div class="hero"><h1>What are we<br>watching?</h1><p>Stop scrolling. Start watching.</p></div><button class="primary" onclick="start()">🎙 Talk to MAX</button><button onclick="start()">🎲 MAX, PICK SOMETHING</button><button onclick="search()">🔎 Search the MAX universe</button>'+(n?'<button onclick="saved()">🕐 Saved for Later <span class="muted">('+n+')</span></button>':'')+'<button onclick="settings()">⚙️ MAX Settings</button><div class="footer">MAX v0.7 · MAX remembers the difference between “not today” and “no.”</div></section>'}function start(){s.i=0;s.a={};s.services=[];q()}function q(){let x=qs[s.i];root.innerHTML='<section class="screen"><div class="top"><button class="back" onclick="'+(s.i?'prev()':'home()')+'">‹ Back</button><span class="muted">'+(s.i+1)+' / 5</span></div><div style="height:3px;background:#24262d;margin-bottom:25px"><i style="display:block;height:100%;background:white;width:'+((s.i+1)*20)+'%"></i></div><div class="q">'+x[0]+'</div><div id="c" class="'+(s.i===1||s.i===4?'grid':'')+'"></div><div id="next"></div><div class="footer">MAX learns from your choices.</div></section>';x[1].forEach(v=>{let b=document.createElement('button');b.textContent=v;if(s.i===4)b.onclick=()=>toggle(v,b);else b.onclick=()=>{s.a[x[2]]=v;s.i++;s.i<5?q():finish()};document.getElementById('c').appendChild(b)});if(s.i===4){let b=document.createElement('button');b.className='primary';b.textContent='Find my pick →';b.onclick=finish;document.getElementById('next').appendChild(b)}}function toggle(v,b){if(v==='EVERYWHERE'){s.services=['EVERYWHERE'];document.querySelectorAll('#c button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');return}document.querySelector('#c button:last-child')?.classList.remove('selected');s.services=s.services.filter(x=>x!=='EVERYWHERE');b.classList.toggle('selected');if(b.classList.contains('selected'))s.services.push(v);else s.services=s.services.filter(x=>x!==v)}function prev(){s.i--;q()}async function api(p){let r=await fetch(API+p,{headers:{Authorization:'Bearer '+tok()}});if(!r.ok)throw Error();return r.json()}function vibe(){let v=s.a.vibe||'';return v.includes('laugh')?'funny':v.includes('hooked')?'hooked':v.includes('think')?'think':v.includes('feeling')?'feeling':v.includes('freak')?'scary':'surprise'}function score(m){let x=(m.vote_average||0)*10,k=vibe(),g=m.genre_ids||[],bonus=0;if(k==='funny'&&g.includes(35))bonus+=18;if(k==='scary'&&g.includes(27))bonus+=22;if(k==='think'&&(g.includes(878)||g.includes(9648)||g.includes(18)))bonus+=16;if(k==='hooked'&&(g.includes(53)||g.includes(80)||g.includes(9648)))bonus+=18;if(k==='feeling'&&(g.includes(18)||g.includes(10749)))bonus+=14;if(s.a.novelty==='Something new'&&Number((m.release_date||m.first_air_date||'').slice(0,4))>=2020)bonus+=7;let y=Number((m.release_date||m.first_air_date||'').slice(0,4));if(s.a.novelty==='Comfort pick'&&y&&y<2020)bonus+=5;let taste=JSON.parse(localStorage.getItem('maxTaste')||'{}');bonus+=(taste[m.id]||0)*4;return x+bonus+Math.min(10,(m.vote_count||0)/1000)}function finish(){if(!tok())return settings();root.innerHTML='<section class="screen center"><div class="hero"><h1>MAX is thinking…</h1><p>Breaking the loop and finding a fresh match.</p></div></section>';setTimeout(async()=>{try{let type=s.a.type?.includes('TV')?'tv':'movie',all=[];for(let p=1;p<=4;p++){let d=await api('/discover/'+type+'?language=en-US&region=US&sort_by=popularity.desc&include_adult=false&page='+p);all.push(...(d.results||[]))}let saved=laterList(),deferred=saved.filter(x=>x.reason==='not-today'&&Date.now()-x.added<7*86400000).map(x=>x.id),rejected=JSON.parse(localStorage.getItem('maxRejected')||'[]');let candidates=all.filter(x=>(x.vote_count||0)>100&&!deferred.includes(x.id)&&!rejected.includes(x.id));if(!candidates.length)candidates=all.filter(x=>(x.vote_count||0)>100&&!rejected.includes(x.id));let savedIds=saved.filter(x=>x.reason==='maybe').map(x=>x.id);candidates.sort((a,b)=>{let sa=score(a),sb=score(b);if(savedIds.includes(a.id))sa+=6;if(savedIds.includes(b.id))sb+=6;return sb-sa});let m=candidates[0];if(!m)throw Error();s.current={...m,type,title:m.title||m.name};detail(s.current)}catch(e){root.innerHTML='<section class="screen center"><div class="hero"><h1>MAX hit a snag.</h1><p>Check TMDB in Settings.</p></div><button class="primary" onclick="settings()">Settings</button></section>'}},300)}function detail(m){root.innerHTML='<section class="screen"><div class="top"><button class="back" onclick="home()">‹ Home</button><span class="muted">MAX PICK</span></div><div class="poster">'+(m.poster_path?'<img src="'+IMG+m.poster_path+'">':'')+'<div><div class="title">'+m.title+'</div><div class="muted">'+((m.release_date||m.first_air_date||'').slice(0,4))+' · TMDB '+Math.round((m.vote_average||0)*10)+'%</div></div></div><b>✦ '+Math.min(98,Math.round(72+(score(m)-m.vote_average*10)*.45))+'% MAX MATCH</b><p class="small">'+(m.overview||'MAX found this in the real catalog.')+'</p><div class="provider" id="providers">Tap below to check U.S. availability.</div><button class="primary" onclick="providers()">📺 FIND WHERE TO WATCH</button><button onclick="later()">🕐 MAYBE ANOTHER TIME</button><button onclick="notToday()">🌙 NOT TODAY</button><button onclick="reject()">👎 NOPE — NOT FOR ME</button><div class="chips"><button onclick="learn(3)">❤️ Loved it</button><button onclick="learn(1)">👍 Liked it</button></div></section>'}function later(){let a=laterList().filter(x=>x.id!==s.current.id);a.push({id:s.current.id,type:s.current.type,title:s.current.title,poster_path:s.current.poster_path,added:Date.now(),reason:'maybe'});saveLater(a);toast('Saved. MAX will bring it back when the vibe fits.');setTimeout(saved,700)}function notToday(){let a=laterList().filter(x=>x.id!==s.current.id);a.push({id:s.current.id,type:s.current.type,title:s.current.title,poster_path:s.current.poster_path,added:Date.now(),notToday:true,reason:'not-today'});saveLater(a);toast('Not today. MAX will revisit it later.');setTimeout(finish,700)}function reject(){let a=JSON.parse(localStorage.getItem('maxRejected')||'[]');if(!a.includes(s.current.id))a.push(s.current.id);localStorage.setItem('maxRejected',JSON.stringify(a));toast('Got it. MAX will stop recommending this one.');setTimeout(finish,700)}function learn(n){let t=JSON.parse(localStorage.getItem('maxTaste')||'{}');t[s.current.id]=(t[s.current.id]||0)+n;localStorage.setItem('maxTaste',JSON.stringify(t));toast('MAX remembers that.')}function saved(){let a=laterList();root.innerHTML='<section class="screen"><div class="top"><button class="back" onclick="home()">‹ Home</button><span class="muted">SAVED FOR LATER</span></div><div class="q">Maybe another time.</div><p class="small">These aren\'t “no.” MAX keeps them available so the right mood can bring them back.</p><div id="list"></div><button class="primary" onclick="finish()">🎲 Find something else</button></section>';let l=document.getElementById('list');if(!a.length){l.innerHTML='<p class="small">Nothing saved yet.</p>';return}a.slice().reverse().forEach(x=>{let b=document.createElement('button');b.className='savedCard';b.innerHTML=(x.poster_path?'<img src="'+IMG+x.poster_path+'">':'')+'<div><b>'+x.title+'</b><span>'+((x.reason==='not-today')?'🌙 Not today':'🕐 Maybe another time')+'</span></div>';b.onclick=()=>load(x.id,x.type);l.appendChild(b)})}async function load(id,type){let x=await api('/'+type+'/'+id+'?language=en-US');s.current={...x,id,type,title:x.title||x.name};detail(s.current)}async function providers(){try{let d=await api('/'+s.current.type+'/'+s.current.id+'/watch/providers'),u=d.results?.US,n=[...(u?.flatrate||[]),...(u?.free||[]),...(u?.ads||[])].map(x=>x.provider_name),r=(u?.rent||[]).map(x=>x.provider_name);document.getElementById('providers').innerHTML=n.length?'<b>Stream in the U.S.</b><br><span class="muted">'+[...new Set(n)].join(' · ')+'</span>':'<span class="muted">No streaming availability returned by TMDB.</span>'+(r.length?'<br><br><b>Rent / buy</b><br><span class="muted">'+[...new Set(r)].join(' · ')+'</span>':'')}catch(e){document.getElementById('providers').textContent='Provider lookup failed.'}}function search(){root.innerHTML='<section class="screen"><div class="top"><button class="back" onclick="home()">‹ Home</button><span class="muted">SEARCH</span></div><div class="q">What are you looking for?</div><input class="input" id="query" placeholder="Movie, show, actor, director..."><button class="primary" onclick="doSearch()">Search</button><div id="results"></div></section>'}async function doSearch(){let q=document.getElementById('query').value;if(!q)return;let e=document.getElementById('results');e.innerHTML='<p class="small">MAX is searching…</p>';try{let d=await api('/search/multi?query='+encodeURIComponent(q)+'&include_adult=false&language=en-US&page=1');e.innerHTML=(d.results||[]).filter(x=>x.media_type==='movie'||x.media_type==='tv').slice(0,8).map(x=>'<button onclick="load('+x.id+',\''+x.media_type+'\')">'+(x.title||x.name)+'</button>').join('')}catch(x){e.textContent='Search failed.'}}function settings(){root.innerHTML='<section class="screen"><div class="top"><button class="back" onclick="home()">‹ Home</button><span class="muted">SETTINGS</span></div><div class="q">TMDB Connection</div><p class="small">Your token is stored only in this browser for the prototype.</p><input class="input" id="t" type="password" placeholder="TMDB Read Access Token" value="'+tok()+'"><button class="primary" onclick="save()">Save & Test TMDB</button></section>'}async function save(){let v=document.getElementById('t').value.trim();localStorage.setItem('maxTmdbToken',v);try{await fetch(API+'/configuration',{headers:{Authorization:'Bearer '+v}}).then(r=>{if(!r.ok)throw Error()});alert('TMDB connected.');home()}catch(e){localStorage.removeItem('maxTmdbToken');alert('Token failed.')}}function toast(t){let x=document.createElement('div');x.className='status';x.textContent=t;x.style.position='fixed';x.style.bottom='20px';x.style.left='18px';x.style.right='18px';x.style.zIndex=9;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}home()</script></body></html>

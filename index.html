<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07080b"><title>MAX — Your Personal Movie Concierge</title><style>:root{--bg:#07080b;--card:#15171c;--line:#2a2d35;--text:#f7f7f8;--muted:#9da1aa}*{box-sizing:border-box}body{margin:0;background:#020305;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;padding:20px 18px 26px;background:radial-gradient(circle at 50% -10%,#292e39 0,#0b0c10 35%,#050609 75%);overflow:hidden}.logo{text-align:center;font-weight:850;letter-spacing:8px;font-size:22px;margin:10px 0 3px}.tag{text-align:center;color:var(--muted);font-size:12px}.screen{min-height:calc(100vh - 76px);display:flex;flex-direction:column}.center{justify-content:center}.hero{text-align:center;margin:auto 0 28px}.hero h1{font-size:35px;line-height:1.04;margin:0 0 12px;letter-spacing:-1.3px}.hero p{color:var(--muted);font-size:16px;margin:0}button{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:16px;padding:16px;font-size:16px;font-weight:650;margin:6px 0;cursor:pointer}button.primary{background:#f5f5f7;color:#08090b;border-color:#f5f5f7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid button{margin:0}.chips{display:flex;flex-wrap:wrap;gap:7px}.chips button{width:auto;margin:0;padding:10px 13px;border-radius:999px;font-size:13px}.top{display:flex;justify-content:space-between;align-items:center;margin:20px 0 25px}.back{width:auto;border:0;background:none;padding:4px;color:var(--muted);margin:0}.q{font-size:28px;line-height:1.08;letter-spacing:-.8px;margin:10px 0 18px}.sub{font-size:14px;color:var(--muted);margin-bottom:14px}.progress{height:3px;background:#24262d;border-radius:4px;overflow:hidden;margin-bottom:20px}.progress i{display:block;height:100%;background:#fff;transition:.25s}.poster{height:300px;border-radius:22px;background:linear-gradient(145deg,#313643,#111319);display:flex;align-items:flex-end;padding:22px;position:relative;overflow:hidden;margin-bottom:16px}.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.72}.poster:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#000d,transparent 65%)}.posterText{position:relative;z-index:1}.posterTitle{font-size:31px;font-weight:850;letter-spacing:-1px}.meta{color:#c8cad0;font-size:13px;margin-top:5px}.match{font-size:14px;font-weight:800;margin:12px 0}.why{color:#b5b8c0;font-size:14px;line-height:1.45}.provider{margin:14px 0;padding:13px;border:1px solid var(--line);border-radius:14px;background:#101217}.provider span{color:#9da1aa;font-size:13px}.section{margin:18px 0}.label{font-size:12px;color:#7f838c;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:9px}.footer{margin-top:auto;color:#666a73;text-align:center;font-size:10px;padding-top:18px;line-height:1.4}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#f4f4f6;color:#08090b;padding:12px 16px;border-radius:14px;font-size:13px;font-weight:700;box-shadow:0 8px 30px #0008;z-index:10}.input{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:#101217;color:white;font-size:15px;margin:5px 0 10px}.small{font-size:12px;color:var(--muted);line-height:1.45}</style></head><body><div class="app"><div class="logo">MAX</div><div class="tag">Your personal movie concierge.</div><main id="root"></main></div><script>const API='https://api.themoviedb.org/3',IMG='https://image.tmdb.org/t/p/w780';const state={i:0,a:{},services:[],current:null,taste:JSON.parse(localStorage.getItem('maxTaste')||'{}')};const root=document.getElementById('root');const token=()=>localStorage.getItem('maxTmdbToken')||'';const questions=[["Movie or TV?",["🎬 Movie","📺 TV"],"type"],["What's the vibe?",["😂 Make me laugh","😮 Keep me hooked","🧠 Make me think","❤️ Something with feeling","😱 Freak me out","🎲 Surprise me"],"vibe"],["How much time have we got?",["Under 90 min","90–120 min","2+ hours","Don't care"],"time"],["Something you've seen before, or something new?",["Comfort pick","Something new","Surprise me"],"novelty"],["Where can I look?",["Netflix","Prime Video","Hulu","Disney+","Max","Paramount+","Peacock","Apple TV+","EVERYWHERE"],"services"]];function home(){root.innerHTML=`<section class="screen center"><div class="hero"><h1>What are we<br>watching?</h1><p>Stop scrolling. Start watching.</p></div><button class="primary" onclick="start()">🎙 Talk to MAX</button><button onclick="start()">🎲 MAX, PICK SOMETHING</button><button onclick="search()">🔎 Search the MAX universe</button><div class="section"><div class="label">Tonight's vibe</div><div class="chips"><button onclick="quick('funny')">😂 Funny</button><button onclick="quick('hooked')">😮 Thriller</button><button onclick="quick('feeling')">❤️ Easy</button><button onclick="quick('surprise')">🎲 Surprise</button></div></div><button onclick="settings()">⚙️ MAX Settings</button><div class="footer">MAX v0.5 · Real TMDB catalog ready</div></section>`}function settings(){root.innerHTML=`<section class="screen"><div class="top"><button class="back" onclick="home()">‹ Home</button><span class="muted">SETTINGS</span></div><div class="q">Connect MAX to TMDB</div><p class="small">Paste your TMDB API Read Access Token below. For this prototype it is stored only in this browser's local storage and is never committed to GitHub.</p><input class="input" id="tmdb" type="password" placeholder="Paste TMDB API Read Access Token" value="${token()}"><button class="primary" onclick="saveToken()">Save & Test TMDB</button><button onclick="clearToken()">Clear Token</button><div class="footer">Production MAX will move this credential behind a secure server-side proxy.</div></section>`}async function saveToken(){let v=document.getElementById('tmdb').value.trim();if(!v)return toast('Paste the TMDB Read Access Token first.');localStorage.setItem('maxTmdbToken',v);try{let r=await fetch(API+'/configuration',{headers:{Authorization:'Bearer '+v}});if(!r.ok)throw Error();toast('TMDB connected.');setTimeout(home,900)}catch(e){localStorage.removeItem('maxTmdbToken');toast('Token failed. Check it and try again.')}}function clearToken(){localStorage.removeItem('maxTmdbToken');toast('TMDB token cleared.')}function quick(v){start();state.a.vibe=v==='surprise'?'🎲 Surprise me':v==='funny'?'😂 Make me laugh':v==='hooked'?'😮 Keep me hooked':'❤️ Something with feeling';state.i=2;renderQ()}function start(){state.i=0;state.a={};state.services=[];renderQ()}function renderQ(){let q=questions[state.i],pct=(state.i+1)/questions.length*100;root.innerHTML=`<section class="screen"><div class="top"><button class="back" onclick="${state.i?'prev()':'home()'}">‹ Back</button><span style="color:#777b84;font-size:12px">${state.i+1} / ${questions.length}</span></div><div class="progress"><i style="width:${pct}%"></i></div><div class="q">${q[0]}</div><div class="sub">${state.i===4?'Pick as many as you want.':''}</div><div class="${state.i===1||state.i===4?'grid':''}" id="choices"></div><div class="footer">MAX learns from your choices.</div></section>`;let c=document.getElementById('choices');q[1].forEach(v=>{let b=document.createElement('button');b.textContent=v;if(state.i===4)b.onclick=()=>toggle(v,b);else b.onclick=()=>answer(v,q[2]);c.appendChild(b)});if(state.i===4){let b=document.createElement('button');b.className='primary';b.textContent='Find my pick';b.onclick=finish;c.appendChild(b)}}function answer(v,k){state.a[k]=v;state.i++;if(state.i<questions.length)renderQ();else finish()}function toggle(v,b){if(v==='EVERYWHERE'){state.services=['EVERYWHERE'];document.querySelectorAll('#choices button').forEach(x=>x.classList.remove('primary'));b.classList.add('primary');return}state.services=state.services.filter(x=>x!=='EVERYWHERE');b.classList.toggle('primary');if(b.classList.contains('primary'))state.services.push(v);else state.services=state.services.filter(x=>x!==v)}function prev(){state.i?(state.i--,renderQ()):home()}function search(){root.innerHTML=`<section class="screen"><div class="top"><button class="back" onclick="home()">‹ Home</button><span class="muted">SEARCH</span></div><div class="q">What are you looking for?</div><input class="input" id="query" placeholder="Movie, show, actor, director..."><button class="primary" onclick="doSearch()">Search</button><div id="searchResults"></div></section>`}async function doSearch(){if(!token())return settings();let q=document.getElementById('query').value.trim();if(!q)return;let el=document.getElementById('searchResults');el.innerHTML='<p class="small">MAX is searching TMDB…</p>';try{let r=await api('/search/multi?query='+encodeURIComponent(q)+'&include_adult=false&language=en-US&page=1');let items=(r.results||[]).filter(x=>x.media_type==='movie'||x.media_type==='tv').slice(0,8);el.innerHTML=items.map(x=>{let title=(x.title||x.name).replace(/</g,'&lt;');return `<button onclick="showItem(${x.id},'${x.media_type}')">${title} <span class="small">· ${x.release_date||x.first_air_date||'—'}</span></button>`}).join('')||'<p class="small">MAX found nothing.</p>'}catch(e){el.innerHTML='<p class="small">TMDB search failed. Check MAX Settings.</p>'}}async function api(path){let r=await fetch(API+path,{headers:{Authorization:'Bearer '+token()}});if(!r.ok)throw Error();return r.json()}async function showItem(id,type){try{let x=await api('/'+type+'/'+id+'?language=en-US&append_to_response=credits');let m={id,title:x.title||x.name,year:(x.release_date||x.first_air_date||'').slice(0,4),overview:x.overview,poster:x.poster_path,score:Math.round((x.vote_average||0)*10),type};state.current=m;detail(m)}catch(e){toast('Could not load that title.')}}function vibeKey(){let v=state.a.vibe||'';return v.includes('laugh')?'funny':v.includes('hooked')?'hooked':v.includes('think')?'think':v.includes('feeling')?'feeling':v.includes('freak')?'scary':'clever'}async function finish(){if(!token())return settings();root.innerHTML='<section class="screen center"><div class="hero"><h1>MAX is thinking…</h1><p>Searching the real catalog.</p></div></section>';try{let type=state.a.type&&state.a.type.includes('TV')?'tv':'movie';let path=`/discover/${type}?language=en-US&region=US&sort_by=popularity.desc&include_adult=false&page=1`;let data=await api(path);let items=(data.results||[]).filter(x=>(x.vote_count||0)>100);if(!items.length)throw Error();let key=vibeKey();items.sort((a,b)=>((b.vote_average||0)+(key==='funny'?b.popularity/100:0))-((a.vote_average||0)+(key==='funny'?a.popularity/100:0)));let m=items[0];state.current={...m,id:m.id,title:m.title||m.name,year:(m.release_date||m.first_air_date||'').slice(0,4),score:Math.min(98,68+Math.round((m.vote_average||0)*3)),type};detail(state.current)}catch(e){root.innerHTML='<section class="screen center"><div class="hero"><h1>MAX hit a snag.</h1><p>Check your TMDB token in Settings and try again.</p></div><button class="primary" onclick="settings()">Open Settings</button></section>'}}async function findProviders(){if(!state.current?.id)return;try{let type=state.current.type||'movie';let d=await api('/'+type+'/'+state.current.id+'/watch/providers');let us=d.results?.US;let names=[...(us?.flatrate||[]),...(us?.free||[]),...(us?.ads||[])].map(x=>x.provider_name);let rent=(us?.rent||[]).map(x=>x.provider_name);document.getElementById('providers').innerHTML=names.length?`<b>Stream in the U.S.</b><br><span>${[...new Set(names)].join(' · ')}</span>${rent.length?`<br><br><b>Rent / buy</b><br><span>${[...new Set(rent)].join(' · ')}</span>`:''}`:'<span>No U.S. streaming availability returned by TMDB for this title.</span>'}catch(e){toast('Provider lookup failed.')}}function detail(m){root.innerHTML=`<section class="screen"><div class="top"><button class="back" onclick="home()">‹ Home</button><span style="color:#777b84;font-size:12px">MAX</span></div><div class="poster">${m.poster?`<img src="${IMG+m.poster}">`:m.poster_path?`<img src="${IMG+m.poster_path}">`:''}<div class="posterText"><div class="posterTitle">${m.title}</div><div class="meta">${m.year||'—'} · ${m.type?.toUpperCase()||'TITLE'} · TMDB ${m.score||''}%</div></div></div><div class="match">✦ ${m.score||90}% MAX MATCH</div><div class="why">${m.overview||'MAX found this in the real catalog.'}</div><div class="provider" id="providers"><span>Provider availability is ready to query.</span></div><button class="primary" onclick="findProviders()">📺 FIND WHERE TO WATCH</button><button onclick="finish()">NOPE — TRY AGAIN</button><div class="chips"><button onclick="feedback('loved')">❤️ Loved it</button><button onclick="feedback('liked')">👍 Liked it</button><button onclick="feedback('meh')">😐 Meh</button><button onclick="feedback('nope')">👎 Nope</button></div></section>`}function feedback(x){let delta=x==='loved'?3:x==='liked'?1:x==='nope'?-3:0;let key=state.current?.title||'unknown';state.taste[key]=(state.taste[key]||0)+delta;localStorage.setItem('maxTaste',JSON.stringify(state.taste));toast('MAX remembers that.')}function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}home();</script></body></html>

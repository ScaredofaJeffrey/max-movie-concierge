<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07080b"><title>MAX</title><style>body{margin:0;background:#07080b;color:#f7f7f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;padding:20px 18px;background:radial-gradient(circle at 50% -10%,#292e39,#050609 65%)}.logo{text-align:center;font-weight:900;letter-spacing:8px;font-size:22px}.tag{text-align:center;color:#9da1aa;font-size:12px}.screen{min-height:calc(100vh - 70px);display:flex;flex-direction:column}.center{justify-content:center}.hero{text-align:center;margin:auto 0 25px}.hero h1{font-size:35px;line-height:1.05;margin:0 0 12px}.hero p,.small{color:#9da1aa}.top{display:flex;justify-content:space-between;align-items:center;margin:20px 0}.input{width:100%;padding:14px;border-radius:14px;border:1px solid #2a2d35;background:#101217;color:white;font-size:16px;box-sizing:border-box}button{width:100%;padding:16px;margin:6px 0;border-radius:16px;border:1px solid #2a2d35;background:#15171c;color:#fff;font-size:16px;font-weight:650;cursor:pointer}button.primary{background:#f5f5f7;color:#08090b}.back{background:none!important;border:0!important;color:#9da1aa!important;text-align:left;padding:4px!important;width:auto}.card{padding:16px;border:1px solid #2a2d35;border-radius:18px;background:#101217}.poster{width:100%;max-height:430px;object-fit:cover;border-radius:14px}.title{font-size:28px;font-weight:850;margin-top:12px}.muted{color:#9da1aa;font-size:13px}</style></head><body><div class="app"><div class="logo">MAX</div><div class="tag">Your personal movie concierge.</div><main id="root"></main></div><script>(function(){const r=document.getElementById('root'),A='https://api.themoviedb.org/3',I='https://image.tmdb.org/t/p/w500';const token=()=>localStorage.getItem('maxTmdbToken')||'';const api=async p=>{let x=await fetch(A+p,{headers:{Authorization:'Bearer '+token()}});if(!x.ok)throw Error('TMDB '+x.status);return x.json()};function home(){renderHome()}function renderHome(){r.innerHTML='<section class="screen center"><div class="hero"><h1>What are we<br>watching?</h1><p>Stop scrolling. Start watching.</p></div><button class="primary" id="pick">🎲 MAX, PICK SOMETHING</button><button id="search">🔎 Search the MAX universe</button><button id="settings">⚙️ MAX Settings</button><div class="small" style="text-align:center;margin-top:25px">MAX stable recovery build · v0.7.3</div></section>';document.getElementById('pick').onclick=pick;document.getElementById('search').onclick=search;document.getElementById('settings').onclick=settings}function settings(){r.innerHTML='<section class="screen"><div class="top"><button class="back" id="home">‹ Home</button></div><div class="hero"><h1>TMDB</h1><p>Connect your existing TMDB token.</p></div><input class="input" id="tmdb" type="password" placeholder="TMDB Read Access Token" value="'+token()+'"><button class="primary" id="save">Save & Test TMDB</button></section>';document.getElementById('home').onclick=home;document.getElementById('save').onclick=async()=>{let t=document.getElementById('tmdb').value.trim();if(!t)return;try{let x=await fetch(A+'/configuration',{headers:{Authorization:'Bearer '+t}});if(!x.ok)throw Error();localStorage.setItem('maxTmdbToken',t);alert('TMDB connected.');home()}catch(e){alert('Token failed. Your existing token was not changed.')}}}function search(){r.innerHTML='<section class="screen"><div class="top"><button class="back" id="home">‹ Home</button><span class="small">SEARCH</span></div><div class="hero"><h1>Search MAX</h1><p>Find a movie or show directly.</p></div><form id="sf"><input class="input" id="q" enterkeyhint="search" autocomplete="off" placeholder="Movie, show, actor, director..."><button class="primary" type="submit">Search</button></form><div id="results"></div></section>';document.getElementById('home').onclick=home;document.getElementById('q').focus();document.getElementById('sf').onsubmit=async e=>{e.preventDefault();let q=document.getElementById('q').value.trim(),out=document.getElementById('results');if(!q)return;out.innerHTML='<p class="small">MAX is searching…</p>';try{let d=await api('/search/multi?query='+encodeURIComponent(q)+'&include_adult=false&language=en-US&page=1'),items=(d.results||[]).filter(x=>x.media_type==='movie'||x.media_type==='tv').slice(0,10);out.innerHTML='';if(!items.length){out.innerHTML='<p class="small">MAX couldn’t find that.</p>';return}items.forEach(x=>{let b=document.createElement('button');b.type='button';b.textContent=x.title||x.name;b.onclick=()=>show(x.id,x.media_type);out.appendChild(b)})}catch(e){out.innerHTML='<p class="small">Search needs a valid TMDB connection. Open Settings if needed.</p>'}}}async function show(id,type){r.innerHTML='<section class="screen center"><div class="hero"><h1>MAX is thinking…</h1><p>Loading your pick.</p></div></section>';try{let x=await api('/'+type+'/'+id+'?language=en-US');detail({...x,id,type,title:x.title||x.name})}catch(e){search()}}function detail(x){r.innerHTML='<section class="screen"><div class="top"><button class="back" id="home">‹ Home</button><span class="small">MAX PICK</span></div><div class="card">'+(x.poster_path?'<img class="poster" src="'+I+x.poster_path+'">':'')+'<div class="title">'+x.title+'</div><p class="muted">'+((x.release_date||x.first_air_date||'').slice(0,4))+' · TMDB '+(x.vote_average?x.vote_average.toFixed(1):'—')+'/10</p><p class="small">'+(x.overview||'MAX found this for you.')+'</p></div><button class="primary" id="another">🔎 Find another</button><button id="back">← Back to MAX</button></section>';document.getElementById('home').onclick=home;document.getElementById('another').onclick=search;document.getElementById('back').onclick=home}async function pick(){if(!token()){settings();return}r.innerHTML='<section class="screen center"><div class="hero"><h1>MAX is thinking…</h1><p>Finding something worth watching.</p></div></section>';try{let d=await api('/discover/movie?language=en-US&region=US&include_adult=false&include_video=false&sort_by=popularity.desc&vote_count.gte=250&page=1'),items=(d.results||[]).filter(x=>!JSON.parse(localStorage.getItem('maxRejected')||'[]').includes(x.id));if(!items.length)throw Error();let x=items[Math.floor(Math.random()*Math.min(items.length,20))];detail({...x,type:'movie',title:x.title})}catch(e){r.innerHTML='<section class="screen center"><div class="hero"><h1>MAX hit a snag.</h1><p>We could not get a recommendation from TMDB.</p></div><button class="primary" id="check">Check TMDB</button><button id="back">Back to MAX</button></section>';document.getElementById('check').onclick=settings;document.getElementById('back').onclick=home}}renderHome()})();</script></body></html>

>{const a=document.createElement('a');a.className='card';a.href='./detail.html?id='+x.id+'&type='+(x.type||'movie');a.innerHTML=(x.poster_path?'<img class="poster" src="https://image.tmdb.org/t/p/w185'+x.poster_path+'">':'')+'<div><div class="title">'+e(x.title||'Untitled')+'</div><div class="reason">'+(x.reason==='not-today'?'🌙 Not today':'🕐 Maybe another time')+'</div></div>';list.appendChild(a)})})();</script></body></html>

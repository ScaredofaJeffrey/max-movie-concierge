<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07080b"><title>MAX — Preference Engine</title><style>body{margin:0;background:#07080b;color:#f7f7f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;padding:20px 18px;background:radial-gradient(circle at 50% -10%,#292e39,#050609 65%)}.logo{text-align:center;font-weight:900;letter-spacing:8px;font-size:22px}.tag,.small,.muted{color:#9da1aa;font-size:13px}.tag{text-align:center;font-size:12px}.top{display:flex;justify-content:space-between;align-items:center;margin:20px 0}.link,button{display:block;width:100%;padding:16px;margin:6px 0;border-radius:16px;border:1px solid #2a2d35;background:#15171c;color:#fff;font-size:16px;font-weight:650;text-decoration:none;text-align:center;box-sizing:border-box;cursor:pointer}.primary{background:#f5f5f7;color:#08090b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.selected{background:#f5f5f7;color:#08090b}.q{font-size:29px;font-weight:800;line-height:1.1;margin:12px 0 18px}.progress{height:4px;background:#24262d;border-radius:5px;overflow:hidden}.progress i{display:block;height:100%;background:#f5f5f7}.hero{text-align:center;margin:32px 0}.hero h1{font-size:35px;line-height:1.05;margin:0 0 12px}.status{padding:13px;border:1px solid #2a2d35;border-radius:14px;background:#101217;margin:12px 0}.footer{text-align:center;color:#666a73;font-size:10px;margin-top:auto;padding:20px}</style></head><body><div class="app"><div class="logo">MAX</div><div class="tag">Your personal movie concierge.</div><main id="root"></main></div><script>(function(){'use strict';const API='https://api.themoviedb.org/3',root=document.getElementById('root'),token=()=>localStorage.getItem('maxTmdbToken')||'',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),Q=[['Movie or TV?',[['🎬 Movie','movie'],['📺 TV','tv']]],['What’s the vibe?',[['😂 Make me laugh','laugh'],['😮 Keep me hooked','hooked'],['🧠 Make me think','think'],['❤️ Something with feeling','feeling'],['😱 Freak me out','freak'],['🎲 Surprise me','surprise']]],['How much time do we have?',[['Under 90 min','short'],['90–120 min','mid'],['2+ hours','long'],['Don’t care','any']]],['Something new or familiar?',[['Comfort pick','comfort'],['Something new','new'],['Surprise me','surprise']]],['Where can you watch it?',[['Netflix','8'],['Prime Video','9'],['Hulu','15'],['Disney+','337'],['Max','1899'],['Paramount+','531'],['Peacock','386'],['Apple TV+','350']]]];let a={type:null,vibe:null,time:null,novelty:null,services:[]},step=0;function href(next,extra){const p=new URLSearchParams(),s={...a,...extra};Object.entries(s).forEach(([k,v])=>{if(Array.isArray(v)&&v.length)p.set(k,v.join(','));else if(v)p.set(k,v)});p.set('step',next);return './pick.html?'+p.toString()}function load(){const p=new URLSearchParams(location.search);a.type=p.get('type')||null;a.vibe=p.get('vibe')||null;a.time=p.get('time')||null;a.novelty=p.get('novelty')||null;a.services=(p.get('services')||'').split(',').filter(Boolean);step=Number(p.get('step')||1)}function render(){const q=Q[step-1],grid=step===2||step===5?'grid':'';root.innerHTML='<section><div class="top"><a class="link" style="width:auto;padding:8px 12px;font-size:13px" href="./index.html">‹ Home</a><span class="small">'+step+' / 5</span></div><div class="progress"><i style="width:'+step/5*100+'%"></i></div><div class="q">'+q[0]+'</div><div id="choices" class="'+grid+'"></div><div class="footer">MAX learns from your reactions and deliberately varies what it shows you.</div></section>';const c=document.getElementById('choices');q[1].forEach(([label,value])=>{const b=document.createElement('a');b.className='link';b.textContent=label;if(step===5){const on=a.services.includes(value);b.href=href(5,{services:on?a.services.filter(x=>x!==value):a.services.concat(value)});if(on)b.className+=' selected'}else{b.href=href(step+1,{[step===1?'type':step===2?'vibe':step===3?'time':'novelty']:value})}c.appendChild(b)});if(step===5){const all=document.createElement('a');all.className='link';all.textContent='🌎 Everywhere';all.href=href('go',{services:[]});c.appendChild(all);const find=document.createElement('a');find.className='link primary';find.textContent='Find my pick →';find.href=href('go',{services:a.services});c.appendChild(find)}}function json(k,d){try{return JSON.parse(localStorage.getItem(k)||d)}catch(_){return JSON.parse(d)}}function affinity(){return json('maxGenreTaste','{}')}function recentGenres(){return json('maxRecentGenres','{}')}function excluded(){const rejected=new Set(json('maxRejected','[]').map(Number)),recent=new Set(json('maxRecent','[]').map(Number)),later=json('maxLater','[]'),notToday=new Set(later.filter(x=>x.reason==='not-today'&&Date.now()-x.added<3*86400000).map(x=>Number(x.id)));return{rejected,recent,notToday}}function score(x){const taste=affinity(),rg=recentGenres(),requested=new Set(genreIds()),ids=x.genre_ids||[],recentPenalty=ids.reduce((s,id)=>s-(Number(rg[id]||0)*9),0),learn=ids.reduce((s,id)=>s+(Number(taste[id]||0)*7),0),requestedBoost=ids.reduce((s,id)=>s+(requested.has(id)?20:0),0);let s=(x.vote_average||0)*9+Math.log10((x.vote_count||1)+1)*3+(x.popularity||0)/25+recentPenalty+learn+requestedBoost;const y=Number((x.release_date||x.first_air_date||'').slice(0,4));if(a.novelty==='new')s+=y>=2020?9:-2;if(a.novelty==='comfort')s+=y&&y<2020?8:0;if(a.novelty==='surprise'||a.vibe==='surprise')s+=Math.random()*18;return s}function genreIds(){const v=a.vibe;return v==='laugh'?[35]:v==='hooked'?[53,80,9648]:v==='think'?[878,9648,18]:v==='feeling'?[18,10749,35]:v==='freak'?[27,53]:[]}async function api(path){if(!token())throw Error('TMDB is not connected.');const r=await fetch(API+path,{headers:{Authorization:'Bearer '+token()}});if(!r.ok)throw Error('TMDB returned '+r.status);return r.json()}async function finish(){if(!token()){location.href='./settings.html';return}root.innerHTML='<section class="hero"><h1>MAX is thinking…</h1><p>Balancing your preferences with some variety.</p><div class="status">Learning your taste…</div></section>';try{const type=a.type==='tv'?'tv':'movie',q=['language=en-US','region=US','include_adult=false','include_video=false','sort_by=popularity.desc','vote_count.gte=100'],g=genreIds();if(g.length)q.push('with_genres='+g.join('|'));if(a.time==='short')q.push('with_runtime.lte=90');if(a.time==='mid')q.push('with_runtime.gte=90','with_runtime.lte=120');if(a.time==='long')q.push('with_runtime.gte=120');if(a.services.length)q.push('watch_region=US','with_watch_providers='+a.services.filter(x=>x!=='EVERYWHERE').join('|'));const d=await api('/discover/'+type+'?'+q.join('&')+'&page=1'),{rejected,recent,notToday}=excluded();let items=(d.results||[]).filter(x=>!rejected.has(Number(x.id))&&!notToday.has(Number(x.id)));const fresh=items.filter(x=>!recent.has(Number(x.id)));if(fresh.length>=3)items=fresh;if(!items.length)throw Error('No matches found after your filters.');items.sort((u,v)=>score(v)-score(u));const top=items.slice(0,10),tasteTop=top.slice(0,5),pick=tasteTop[Math.floor(Math.random()*tasteTop.length)];const history=[Number(pick.id),...Array.from(recent).filter(id=>Number(id)!==Number(pick.id))].slice(0,12),rg=recentGenres(),y=pick.genre_ids||[];y.forEach(id=>rg[id]=(Number(rg[id]||0)+1));Object.keys(rg).forEach(id=>{rg[id]=Math.max(0,Math.min(4,Number(rg[id])))});localStorage.setItem('maxRecent',JSON.stringify(history));localStorage.setItem('maxRecentGenres',JSON.stringify(rg));localStorage.setItem('maxLastPreferences',JSON.stringify(a));location.href='./detail.html?id='+pick.id+'&type='+type}catch(err){root.innerHTML='<section class="hero"><h1>MAX hit a snag.</h1><div class="status">'+esc(err.message)+'</div><a class="link primary" href="./settings.html">Check TMDB</a><a class="link" href="./index.html">Back to MAX</a></section>'}}load();if(location.search.includes('step=go'))finish();else if(step>=1&&step<=5)render();else render()})();</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07080b"><title>MAX — Preference Engine</title><style>body{margin:0;background:#07080b;color:#f7f7f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;padding:20px 18px;background:radial-gradient(circle at 50% -10%,#292e39,#050609 65%)}.logo{text-align:center;font-weight:900;letter-spacing:8px;font-size:22px}.tag,.small,.muted{color:#9da1aa;font-size:13px}.tag{text-align:center;font-size:12px}.top{display:flex;justify-content:space-between;align-items:center;margin:20px 0}.link,button{display:block;width:100%;padding:16px;margin:6px 0;border-radius:16px;border:1px solid #2a2d35;background:#15171c;color:#fff;font-size:16px;font-weight:650;text-decoration:none;text-align:center;box-sizing:border-box;cursor:pointer}.primary{background:#f5f5f7;color:#08090b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid button{margin:0}.selected{background:#f5f5f7;color:#08090b}.q{font-size:29px;font-weight:800;line-height:1.1;margin:12px 0 18px}.progress{height:4px;background:#24262d;border-radius:5px;overflow:hidden}.progress i{display:block;height:100%;background:#f5f5f7}.hero{text-align:center;margin:32px 0}.hero h1{font-size:35px;line-height:1.05;margin:0 0 12px}.footer{text-align:center;color:#666a73;font-size:10px;margin-top:auto;padding:20px}</style></head><body><div class="app"><div class="logo">MAX</div><div class="tag">Your personal movie concierge.</div><main id="root"></main></div><script>const API='https://api.themoviedb.org/3',IMG='https://image.tmdb.org/t/p/w780',t=()=>localStorage.getItem('maxTmdbToken')||'';const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const Q=[['Movie or TV?',['🎬 Movie','📺 TV'],'type'],['What’s the vibe?',['😂 Make me laugh','😮 Keep me hooked','🧠 Make me think','❤️ Something with feeling','😱 Freak me out','🎲 Surprise me'],'vibe'],['How much time do we have?',['Under 90 min','90–120 min','2+ hours',"Don’t care"],'time'],['Something new or familiar?',['Comfort pick','Something new','Surprise me'],'novelty'],['Where can you watch it?',['Netflix','Prime Video','Hulu','Disney+','Max','Paramount+','Peacock','EVERYWHERE'],'services']];let a={type:null,vibe:null,time:null,novelty:null,services:[]},step=0,root=document.getElementById('root');function render(){const q=Q[step];root.innerHTML='<section><div class="top"><a class="link" style="width:auto;padding:8px 12px;font-size:13px" href="./index.html">‹ Home</a><span class="small">'+(step+1)+' / 5</span></div><div class="progress"><i style="width:'+((step+1)/5*100)+'%"></i></div><div class="q">'+q[0]+'</div><div id="choices" class="'+(step===1||step===4?'grid':'')+'"></div><div id="next"></div><div class="footer">MAX uses your answers to find a better match.</div></section>';const c=document.getElementById('choices');q[1].forEach(v=>{const b=document.createElement('button');b.textContent=v;if(step===4)b.onclick=()=>toggle(v,b);else b.onclick=()=>answer(v,q[2]);c.appendChild(b)});if(step===4){const n=document.createElement('button');n.className='primary';n.textContent='Find my pick →';n.onclick=finish;document.getElementById('next').appendChild(n)}}function answer(v,k){a[k]=v;step++;step<Q.length?render():finish()}function toggle(v,b){if(v==='EVERYWHERE'){a.services=['EVERYWHERE'];document.querySelectorAll('#choices button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');return}a.services=a.services.filter(x=>x!=='EVERYWHERE');b.classList.toggle('selected');b.classList.contains('selected')?a.services.push(v):a.services=a.services.filter(x=>x!==v)}async function api(p){const r=await fetch(API+p,{headers:{Authorization:'Bearer '+t()}});if(!r.ok)throw Error('TMDB returned '+r.status);return r.json()}function genreWanted(){const v=a.vibe||'';if(v.includes('laugh'))return [35];if(v.includes('hooked'))return [53,80,9648];if(v.includes('think'))return [878,9648,18];if(v.includes('feeling'))return [18,10749,35];if(v.includes('freak'))return [27,53];return []}function noveltyFit(x){const y=Number((x.release_date||x.first_air_date||'').slice(0,4));if(!y)return 0;if(a.novelty==='Something new')return y>=2020?10:-3;if(a.novelty==='Comfort pick')return y<2020?8:0;return 0}function tasteScore(x){const t=JSON.parse(localStorage.getItem('maxTaste')||'{}');return Number(t[x.id]||0)*5}function blocked(){return new Set(JSON.parse(localStorage.getItem('maxRejected')||'[]').map(Number))}async function providers(type,id){try{const d=await api('/'+type+'/'+id+'/watch/providers');const u=d.results?.US;return [...(u?.flatrate||[]),...(u?.free||[]),...(u?.ads||[])].map(x=>x.provider_name)}catch(_){return []}}async function finish(){if(!t()){location.href='./settings.html';return}root.innerHTML='<section class="hero"><h1>MAX is thinking…</h1><p>Matching your answers against the real catalog.</p></section>';try{const type=a.type.includes('TV')?'tv':'movie',all=[];for(let p=1;p<=4;p++){const d=await api('/discover/'+type+'?language=en-US&region=US&include_adult=false&include_video=false&sort_by=popularity.desc&page='+p);all.push(...(d.results||[]))}const rej=blocked(),later=JSON.parse(localStorage.getItem('maxLater')||'[]'),notToday=later.filter(x=>x.reason==='not-today'&&Date.now()-x.added<3*86400000).map(x=>Number(x.id)),maybe=new Set(later.filter(x=>x.reason==='maybe').map(x=>Number(x.id)));let cand=all.filter(x=>(x.vote_count||0)>100&&!rej.has(Number(x.id))&&!notToday.includes(Number(x.id)));if(!cand.length)cand=all.filter(x=>!rej.has(Number(x.id)));const genres=genreWanted(),serviceSet=a.services.filter(x=>x!=='EVERYWHERE'),scored=[];for(const x of cand.slice(0,60)){let z=(x.vote_average||0)*8+(x.popularity||0)/10;z+=genres.reduce((n,g)=>n+((x.genre_ids||[]).includes(g)?16:0),0);z+=noveltyFit(x)+tasteScore(x);if(maybe.has(Number(x.id)))z+=7;if(a.novelty==='Surprise me')z+=Math.random()*12;if(a.vibe?.includes('Surprise'))z+=Math.random()*15;if(serviceSet.length){const names=await providers(type,x.id);z+=names.some(n=>serviceSet.some(w=>n.toLowerCase().includes(w.toLowerCase())))?18:-6}scored.push({x,z})}scored.sort((m,n)=>n.z-m.z);const pick=(scored.slice(0,10).sort(()=>Math.random()-.5)[0]||scored[0])?.x;if(!pick)throw Error('No matching titles found.');localStorage.setItem('maxLastPreferences',JSON.stringify(a));location.href='./detail.html?id='+pick.id+'&type='+type}catch(err){root.innerHTML='<section class="hero"><h1>MAX hit a snag.</h1><p>'+e(err.message)+'</p></section><a class="link primary" href="./settings.html">Check TMDB</a><a class="link" href="./index.html">Back to MAX</a>'}}render();</script></body></html>

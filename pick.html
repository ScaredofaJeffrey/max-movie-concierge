<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07080b"><title>MAX — Preference Engine</title><style>body{margin:0;background:#07080b;color:#f7f7f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;padding:20px 18px;background:radial-gradient(circle at 50% -10%,#292e39,#050609 65%)}.logo{text-align:center;font-weight:900;letter-spacing:8px;font-size:22px}.tag,.small,.muted{color:#9da1aa;font-size:13px}.tag{text-align:center;font-size:12px}.top{display:flex;justify-content:space-between;align-items:center;margin:20px 0}.link,button{display:block;width:100%;padding:16px;margin:6px 0;border-radius:16px;border:1px solid #2a2d35;background:#15171c;color:#fff;font-size:16px;font-weight:650;text-decoration:none;text-align:center;box-sizing:border-box;cursor:pointer}.primary{background:#f5f5f7;color:#08090b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid button{margin:0}.selected{background:#f5f5f7;color:#08090b}.q{font-size:29px;font-weight:800;line-height:1.1;margin:12px 0 18px}.progress{height:4px;background:#24262d;border-radius:5px;overflow:hidden}.progress i{display:block;height:100%;background:#f5f5f7}.hero{text-align:center;margin:32px 0}.hero h1{font-size:35px;line-height:1.05;margin:0 0 12px}.status{padding:13px;border:1px solid #2a2d35;border-radius:14px;background:#101217;margin:12px 0}.footer{text-align:center;color:#666a73;font-size:10px;margin-top:auto;padding:20px}</style></head><body><div class="app"><div class="logo">MAX</div><div class="tag">Your personal movie concierge.</div><main id="root"></main></div><script>(function(){'use strict';const API='https://api.themoviedb.org/3',root=document.getElementById('root'),token=()=>localStorage.getItem('maxTmdbToken')||'',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),Q=[['Movie or TV?',['🎬 Movie','📺 TV'],'type'],['What’s the vibe?',['😂 Make me laugh','😮 Keep me hooked','🧠 Make me think','❤️ Something with feeling','😱 Freak me out','🎲 Surprise me'],'vibe'],['How much time do we have?',['Under 90 min','90–120 min','2+ hours','Don’t care'],'time'],['Something new or familiar?',['Comfort pick','Something new','Surprise me'],'novelty'],['Where can you watch it?',['Netflix','Prime Video','Hulu','Disney+','Max','Paramount+','Peacock','EVERYWHERE'],'services']];let p={type:null,vibe:null,time:null,novelty:null,services:[]},step=0;function render(){const q=Q[step];root.innerHTML='<section><div class="top"><a class="link" style="width:auto;padding:8px 12px;font-size:13px" href="./index.html">‹ Home</a><span class="small">'+(step+1)+' / 5</span></div><div class="progress"><i style="width:'+((step+1)/Q.length*100)+'%"></i></div><div class="q">'+q[0]+'</div><div id="choices" class="'+(step===1||step===4?'grid':'')+'"></div><div id="next"></div><div class="footer">MAX uses your answers to find a better match.</div></section>';const c=document.getElementById('choices');q[1].forEach(v=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>step===4?toggle(v,b):answer(v,q[2]);c.appendChild(b)});if(step===4){const n=document.createElement('button');n.className='primary';n.textContent='Find my pick →';n.onclick=finish;document.getElementById('next').appendChild(n)}}function answer(v,k){p[k]=v;step++;if(step<Q.length)render();else finish()}function toggle(v,b){if(v==='EVERYWHERE'){p.services=['EVERYWHERE'];document.querySelectorAll('#choices button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');return}p.services=p.services.filter(x=>x!=='EVERYWHERE');b.classList.toggle('selected');if(b.classList.contains('selected'))p.services.push(v);else p.services=p.services.filter(x=>x!==v)}async function api(path){if(!token())throw Error('TMDB is not connected.');const r=await fetch(API+path,{headers:{Authorization:'Bearer '+token()}});if(!r.ok)throw Error('TMDB returned '+r.status);return r.json()}function genreIds(){const v=p.vibe||'';if(v.includes('laugh'))return [35];if(v.includes('hooked'))return [53,80,9648];if(v.includes('think'))return [878,9648,18];if(v.includes('feeling'))return [18,10749,35];if(v.includes('freak'))return [27,53];return []}function runtime(){if(p.time==='Under 90 min')return ['with_runtime.lte=90'];if(p.time==='90–120 min')return ['with_runtime.gte=90','with_runtime.lte=120'];if(p.time==='2+ hours')return ['with_runtime.gte=120'];return []}function recentIds(){return new Set(JSON.parse(localStorage.getItem('maxRecent')||'[]').map(Number))}function rejectedIds(){return new Set(JSON.parse(localStorage.getItem('maxRejected')||'[]').map(Number))}function taste(x){const t=JSON.parse(localStorage.getItem('maxTaste')||'{}');return Number(t[x.id]||0)*6}function novelty(x){const y=Number((x.release_date||x.first_air_date||'').slice(0,4));if(!y)return 0;if(p.novelty==='Something new')return y>=2020?12:-2;if(p.novelty==='Comfort pick')return y<2020?10:0;return Math.random()*8}function score(x){let s=(x.vote_average||0)*10+(Math.log10((x.vote_count||1)+1)*3)+(x.popularity||0)/20;s+=genreIds().reduce((n,g)=>n+((x.genre_ids||[]).includes(g)?24:0),0);s+=novelty(x)+taste(x);return s}function buildDiscover(type){const q=['language=en-US','region=US','include_adult=false','include_video=false','sort_by=popularity.desc','vote_count.gte=100'];const g=genreIds();if(g.length)q.push('with_genres='+g.join('|'));q.push(...runtime());return q}function showStatus(title,msg){root.innerHTML='<section class="hero"><h1>'+esc(title)+'</h1><p>'+esc(msg)+'</p></section>'}async function finish(){if(!token()){location.href='./settings.html';return}showStatus('MAX is thinking…','Finding a strong match from TMDB.');try{const type=p.type.includes('TV')?'tv':'movie';const parts=buildDiscover(type);const all=[];for(let page=1;page<=3;page++){const d=await api('/discover/'+type+'?'+parts.join('&')+'&page='+page);all.push(...(d.results||[]))}const rejected=rejectedIds(),recent=recentIds(),later=JSON.parse(localStorage.getItem('maxLater')||'[]'),notToday=new Set(later.filter(x=>x.reason==='not-today'&&Date.now()-x.added<3*86400000).map(x=>Number(x.id))),maybe=new Set(later.filter(x=>x.reason==='maybe').map(x=>Number(x.id)));let candidates=all.filter(x=>!rejected.has(Number(x.id))&&!notToday.has(Number(x.id)));const fresh=candidates.filter(x=>!recent.has(Number(x.id)));if(fresh.length>=5)candidates=fresh;if(p.services.length&&!p.services.includes('EVERYWHERE')){showStatus('MAX is thinking…','Checking your streaming preference…');const pd=await api('/watch/providers/'+type+'?language=en-US&watch_region=US');const wanted=p.services.map(s=>s.toLowerCase()),providerIds=new Set((pd.results||[]).filter(x=>wanted.some(w=>x.provider_name.toLowerCase().includes(w))).map(x=>Number(x.provider_id)));if(providerIds.size){const ps=providerIds;const withProvider=candidates.filter(x=>x.watch_provider_ids?x.watch_provider_ids.some(id=>ps.has(Number(id))):false);if(withProvider.length)candidates=withProvider}}if(!candidates.length)candidates=all.filter(x=>!rejected.has(Number(x.id)));if(!candidates.length)throw Error('No matching titles found.');candidates.sort((a,b)=>score(b)-score(a));if(maybe.size)candidates.sort((a,b)=>{const am=maybe.has(Number(a.id)),bm=maybe.has(Number(b.id));return bm-am});const top=candidates.slice(0,12),pick=top[Math.floor(Math.random()*top.length)];const history=[Number(pick.id),...Array.from(recent).filter(x=>Number(x)!==Number(pick.id))].slice(0,12);localStorage.setItem('maxRecent',JSON.stringify(history));localStorage.setItem('maxLastPreferences',JSON.stringify(p));location.href='./detail.html?id='+pick.id+'&type='+type}catch(err){showStatus('MAX hit a snag.',err.message+' Try again or check TMDB in Settings.');root.insertAdjacentHTML('beforeend','<a class="link primary" href="./settings.html">Check TMDB</a><a class="link" href="./index.html">Back to MAX</a>')}}render()})();</script></body></html>

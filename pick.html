<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07080b"><title>MAX Pick</title><style>body{margin:0;background:#07080b;color:#f7f7f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;padding:20px 18px;background:#07080b}.logo{text-align:center;font-weight:900;letter-spacing:8px;font-size:22px}.tag,.small{color:#9da1aa;font-size:13px}.tag{text-align:center;font-size:12px}.link{display:block;width:100%;padding:16px;margin:6px 0;border-radius:16px;border:1px solid #2a2d35;background:#15171c;color:#fff;font-size:16px;font-weight:650;text-decoration:none;text-align:center;box-sizing:border-box}.primary{background:#f5f5f7;color:#08090b}.center{text-align:center;margin-top:30vh}.status{padding:14px;border:1px solid #2a2d35;border-radius:14px;background:#101217}.poster{width:100%;max-height:430px;object-fit:cover;border-radius:14px}.card{padding:16px;border:1px solid #2a2d35;border-radius:18px;background:#101217}.title{font-size:28px;font-weight:850}</style></head><body><div class="app"><div class="logo">MAX</div><div class="tag">Your personal movie concierge.</div><div id="out" class="center"><div class="status">MAX is thinking…</div></div></div><script>const API='https://api.themoviedb.org/3',t=()=>localStorage.getItem('maxTmdbToken')||'',e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function run(){const out=document.getElementById('out');if(!t()){out.innerHTML='<div class="status">TMDB is not connected.</div><a class="link primary" href="./settings.html">Open Settings</a>';return}try{const r=await fetch(API+'/discover/movie?language=en-US&region=US&include_adult=false&include_video=false&sort_by=popularity.desc&vote_count.gte=250&page=1',{headers:{Authorization:'Bearer '+t()}});if(!r.ok)throw Error('TMDB returned '+r.status);const d=await r.json(),blocked=new Set(JSON.parse(localStorage.getItem('maxRejected')||'[]').map(Number)),items=(d.results||[]).filter(x=>!blocked.has(Number(x.id)));if(!items.length)throw Error('No recommendations available.');const x=items[Math.floor(Math.random()*Math.min(items.length,20))];out.innerHTML='<div class="card">'+(x.poster_path?'<img class="poster" src="https://image.tmdb.org/t/p/w780'+x.poster_path+'">':'')+'<div class="title">'+e(x.title)+'</div><p class="small">'+e((x.release_date||'').slice(0,4))+' · TMDB '+(x.vote_average?x.vote_average.toFixed(1):'—')+'/10</p><p class="small">'+e(x.overview||'MAX found this for you.')+'</p></div><a class="link primary" href="./pick.html?v='+Date.now()+'">🎲 Pick Again</a><a class="link" href="./search.html">🔎 Search</a><a class="link" href="./index.html">← Back to MAX</a>'}catch(err){out.innerHTML='<div class="status">'+e(err.message)+'</div><a class="link primary" href="./settings.html">Check TMDB</a><a class="link" href="./index.html">Back to MAX</a>'}}run()</script></body></html>

<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07080b">
    <title>MAX — Add a Service</title>
    <link rel="stylesheet" href="./assets/max.css">
    <script src="./assets/services.js" defer></script>
  </head>

  <body>
    <div class="app">
      <header>
        <div class="logo">MAX</div>
        <p class="tag">Your personal movie concierge.</p>
      </header>

      <main>
        <nav class="top" aria-label="MAX navigation">
          <a class="link back-link" href="./index.html">‹ Home</a>
        </nav>

        <section aria-labelledby="services-title">
          <h1 id="services-title" class="q">Open up MAX's search</h1>
          <p class="muted">
            You’ve gone through a few strong matches on your current services.
            Add one more service and MAX will widen the pool while keeping your current preferences.
          </p>

          <div id="choices"></div>

          <p class="small">Your existing services stay selected.</p>
        </section>
      </main>
    </div>
  </body>
</html>

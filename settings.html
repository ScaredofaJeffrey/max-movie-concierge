<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07080b">
    <title>MAX Settings</title>
    <link rel="stylesheet" href="./assets/max.css">
    <script src="./assets/settings.js" defer></script>
  </head>

  <body>
    <div class="app">
      <header>
        <div class="logo">MAX</div>
        <p class="tag">Your personal movie concierge.</p>
      </header>

      <main>
        <nav class="top" aria-label="MAX navigation">
          <a class="link back-link" href="./index.html">‹ Home</a>
        </nav>

        <section aria-labelledby="settings-title">
          <h1 id="settings-title">TMDB Settings</h1>
          <p class="small">
            Your prototype token stays in this browser's local storage.
          </p>

          <form id="settings-form">
            <label class="visually-hidden" for="token">TMDB Read Access Token</label>
            <input
              class="input"
              id="token"
              type="password"
              autocomplete="off"
              placeholder="TMDB Read Access Token"
            >
            <button class="primary" id="save" type="submit">Save &amp; Test TMDB</button>
          </form>

          <div id="msg" class="status" aria-live="polite"></div>
        </section>
      </main>
    </div>
  </body>
</html>

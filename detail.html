<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07080b"><title>MAX Pick</title><style>body{margin:0;background:#07080b;color:#f7f7f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;padding:20px 18px;background:radial-gradient(circle at 50% -10%,#292e39,#050609 65%)}.logo{text-align:center;font-weight:900;letter-spacing:8px;font-size:22px}.tag,.muted,.small{color:#9da1aa;font-size:13px}.tag{text-align:center;font-size:12px}.top{margin:20px 0}.link,button{display:block;width:100%;padding:16px;margin:6px 0;border-radius:16px;border:1px solid #2a2d35;background:#15171c;color:#fff;font-size:16px;font-weight:650;text-decoration:none;text-align:center;box-sizing:border-box;cursor:pointer}.primary{background:#f5f5f7;color:#08090b}.card{padding:16px;border:1px solid #2a2d35;border-radius:18px;background:#101217}.poster{width:100%;max-height:430px;object-fit:cover;border-radius:14px;margin-bottom:12px}.title{font-size:30px;font-weight:850}.status{padding:13px;border:1px solid #2a2d35;border-radius:14px;background:#101217;margin:10px 0}.actions{margin-top:14px}.reaction{background:#101217}.maxSays{padding:14px 16px;border:1px solid #2a2d35;border-radius:16px;background:#15171c;margin:14px 0;font-size:15px;line-height:1.45}.speaking{box-shadow:0 0 0 4px #24262d}</style></head><body><div class="app"><div class="logo">MAX</div><div class="tag">Your personal movie concierge.</div><div class="top"><a class="link" href="./index.html?v=097">‹ Home</a></div><div id="out" class="status">MAX is loading…</div></div><script>(function(){'use strict';const API='https://api.themoviedb.org/3',IMG='https://image.tmdb.org/t/p/w780',token=()=>localStorage.getItem('maxTmdbToken')||'',voiceOn=()=>localStorage.getItem('maxVoiceReplies')!=='off',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),speak=t=>{if(!voiceOn()||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.95;u.pitch=1;u.volume=1;speechSynthesis.speak(u)}catch(_){}},out=document.getElementById('out');async function api(p){const r=await fetch(API+p,{headers:{Authorization:'Bearer '+token()}});if(!r.ok)throw Error('TMDB returned '+r.status);return r.json()}function later(){const a=JSON.parse(localStorage.getItem('maxLater')||'[]').filter(x=>Number(x.id)!==Number(item.id));a.push({id:Number(item.id),type:item.type,title:item.title,poster_path:item.poster_path||'',overview:item.overview||'',added:Date.now(),reason:'maybe'});localStorage.setItem('maxLater',JSON.stringify(a));next('maybe')}function adjust(delta){const t=JSON.parse(localStorage.getItem('maxGenreTaste')||'{}');(item.genres||[]).forEach(g=>{t[g.id]=Math.max(-5,Math.min(5,Number(t[g.id]||0)+delta))});localStorage.setItem('maxGenreTaste',JSON.stringify(t))}function next(reason){const history=JSON.parse(localStorage.getItem('maxReactionHistory')||'[]');history.unshift({id:item.id,reason,genres:(item.genres||[]).map(g=>g.id),at:Date.now()});localStorage.setItem('maxReactionHistory',JSON.stringify(history.slice(0,30)));const streak=Number(localStorage.getItem('maxNoWatchStreak')||0)+1;localStorage.setItem('maxNoWatchStreak',String(streak));location.href='./repeat.html?v='+Date.now()}let item=null;function comment(){const q=JSON.parse(localStorage.getItem('maxLastPreferences')||'{}');const mood={laugh:'funny',hooked:'tense',think:'thought-provoking',feeling:'emotional',freak:'creepy',surprise:'a wildcard'}[q.vibe]||'your kind of';const age={new:'newer',comfort:'familiar',surprise:'a change of pace'}[q.novelty]||'something different';return 'Okay, I found you something '+mood+' and '+age+'. I think this one is worth a shot.'}function renderItem(){const msg=comment();out.innerHTML='<div class="card">'+(item.poster_path?'<img class="poster" src="'+IMG+item.poster_path+'">':'')+'<div class="title">'+esc(item.title)+'</div><p class="muted">'+esc((item.release_date||item.first_air_date||'').slice(0,4))+' · TMDB '+(item.vote_average?item.vote_average.toFixed(1):'—')+'/10</p><p class="small">'+esc(item.overview||'MAX found this for you.')+'</p></div><div class="maxSays"><strong>MAX says:</strong> '+esc(msg)+'</div><div class="actions"><button class="reaction" id="find">🎲 Find another</button><button class="reaction" id="later">🕐 Maybe another time</button><button class="reaction" id="today">🌙 Not today</button><button class="reaction" id="nope">👎 No, never</button></div>';if(voiceOn())speak(msg);document.getElementById('find').onclick=()=>{adjust(-0.5);if(voiceOn())speak('Sure. I’ll find you another one.');next('find-another')};document.getElementById('later').onclick=()=>{if(voiceOn())speak('No problem. I’ll save this one for later and find you another.');later()};document.getElementById('today').onclick=()=>{adjust(-1);if(voiceOn())speak('Got it. Not tonight. I’ll try something else.');next('not-today')};document.getElementById('nope').onclick=()=>{adjust(-4);const r=new Set(JSON.parse(localStorage.getItem('maxRejected')||'[]').map(Number));r.add(Number(item.id));localStorage.setItem('maxRejected',JSON.stringify([...r]));if(voiceOn())speak('Understood. I won’t recommend that one again.');next('no-never')}}async function run(){const p=new URLSearchParams(location.search),id=p.get('id'),type=p.get('type')||'movie';if(!id){out.innerHTML='<div class="status">No title selected.</div><a class="link primary" href="./index.html">Back to MAX</a>';return}if(!token()){out.innerHTML='<div class="status">TMDB is not connected.</div><a class="link primary" href="./settings.html">Open Settings</a>';return}try{const x=await api('/'+type+'/'+id+'?language=en-US');item={...x,id:Number(id),type,title:x.title||x.name};renderItem()}catch(err){out.innerHTML='<div class="status">'+esc(err.message)+'</div><a class="link primary" href="./search.html">Back to Search</a><a class="link" href="./index.html">Back to MAX</a>'}}run()})();</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07080b"><title>MAX Pick</title><style>body{margin:0;background:#07080b;color:#f7f7f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;padding:20px 18px;background:radial-gradient(circle at 50% -10%,#292e39,#050609 65%)}.logo{text-align:center;font-weight:900;letter-spacing:8px;font-size:22px}.tag,.muted,.small{color:#9da1aa;font-size:13px}.tag{text-align:center;font-size:12px}.top{margin:20px 0}.link,button{display:block;width:100%;padding:16px;margin:6px 0;border-radius:16px;border:1px solid #2a2d35;background:#15171c;color:#fff;font-size:16px;font-weight:650;text-decoration:none;text-align:center;box-sizing:border-box;cursor:pointer}.primary{background:#f5f5f7;color:#08090b}.card{padding:16px;border:1px solid #2a2d35;border-radius:18px;background:#101217}.poster{width:100%;max-height:430px;object-fit:cover;border-radius:14px;margin-bottom:12px}.title{font-size:30px;font-weight:850}.status{padding:13px;border:1px solid #2a2d35;border-radius:14px;background:#101217;margin:10px 0}.actions{margin-top:14px}</style></head><body><div class="app"><div class="logo">MAX</div><div class="tag">Your personal movie concierge.</div><div class="top"><a class="link" href="./index.html">‹ Home</a></div><div id="out" class="status">MAX is loading…</div></div><script>const API='https://api.themoviedb.org/3',IMG='https://image.tmdb.org/t/p/w780',t=()=>localStorage.getItem('maxTmdbToken')||'',e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p){const r=await fetch(API+p,{headers:{Authorization:'Bearer '+t()}});if(!r.ok)throw Error('TMDB returned '+r.status);return r.json()}function later(){const p=new URLSearchParams(location.search),id=Number(p.get('id')),type=p.get('type')||'movie',a=JSON.parse(localStorage.getItem('maxLater')||'[]').filter(x=>Number(x.id)!==id);a.push({id,type,reason:'maybe',added:Date.now()});localStorage.setItem('maxLater',JSON.stringify(a));showMessage('🕐 Saved. MAX will revisit it when the vibe fits.','./index.html')}function notToday(){const p=new URLSearchParams(location.search),id=Number(p.get('id')),type=p.get('type')||'movie',a=JSON.parse(localStorage.getItem('maxLater')||'[]').filter(x=>Number(x.id)!==id);a.push({id,type,reason:'not-today',added:Date.now()});localStorage.setItem('maxLater',JSON.stringify(a));location.href='./pick.html?v=080'}function nope(){const p=new URLSearchParams(location.search),id=Number(p.get('id')),a=JSON.parse(localStorage.getItem('maxRejected')||'[]').map(Number);if(!a.includes(id))a.push(id);localStorage.setItem('maxRejected',JSON.stringify(a));location.href='./pick.html?v=080'}function showMessage(msg,back){document.getElementById('out').innerHTML='<div class="status">'+msg+'</div><a class="link primary" href="'+back+'">Back to MAX</a>'}async function run(){const p=new URLSearchParams(location.search),id=p.get('id'),type=p.get('type')||'movie',out=document.getElementById('out');if(!id){out.innerHTML='<div class="status">No title selected.</div>';return}if(!t()){out.innerHTML='<div class="status">TMDB is not connected.</div><a class="link primary" href="./settings.html">Open Settings</a>';return}try{const x=await api('/'+type+'/'+id+'?language=en-US'),title=x.title||x.name,year=(x.release_date||x.first_air_date||'').slice(0,4);out.innerHTML='<div class="card">'+(x.poster_path?'<img class="poster" src="'+IMG+x.poster_path+'">':'')+'<div class="title">'+e(title)+'</div><p class="muted">'+e(year)+' · TMDB '+(x.vote_average?x.vote_average.toFixed(1):'—')+'/10</p><p class="small">'+e(x.overview||'MAX found this for you.')+'</p></div><div class="actions"><a class="link primary" href="./search.html">🔎 Find another</a><button onclick="later()">🕐 Maybe another time</button><button onclick="notToday()">🌙 Not today</button><button onclick="nope()">👎 No, never</button></div>'}catch(err){out.innerHTML='<div class="status">'+e(err.message)+'</div><a class="link primary" href="./search.html">Back to Search</a><a class="link" href="./index.html">Back to MAX</a>'}}run()</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07080b"><title>MAX — Another Pick</title><style>body{margin:0;background:#07080b;color:#f7f7f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;padding:20px 18px;background:radial-gradient(circle at 50% -10%,#292e39,#050609 65%)}.logo{text-align:center;font-weight:900;letter-spacing:8px;font-size:22px}.tag{text-align:center;color:#9da1aa;font-size:12px}.hero{text-align:center;margin-top:28vh}.hero h1{font-size:32px;margin:0 0 10px}.small{color:#9da1aa;font-size:13px}.status{padding:13px;border:1px solid #2a2d35;border-radius:14px;background:#101217;margin:18px 0}.link{display:block;width:100%;padding:16px;margin:6px 0;border-radius:16px;border:1px solid #2a2d35;background:#15171c;color:#fff;font-size:16px;font-weight:650;text-decoration:none;text-align:center;box-sizing:border-box}.primary{background:#f5f5f7;color:#08090b}</style></head><body><div class="app"><div class="logo">MAX</div><div class="tag">Your personal movie concierge.</div><main id="root"></main></div><script>(function(){'use strict';const API='https://api.themoviedb.org/3',token=()=>localStorage.getItem('maxTmdbToken')||'',root=document.getElementById('root');const prefs=(()=>{try{return JSON.parse(localStorage.getItem('maxLastPreferences')||'null')}catch(_){return null}})();function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function api(path){const r=await fetch(API+path,{headers:{Authorization:'Bearer '+token()}});if(!r.ok)throw Error('TMDB returned '+r.status);return r.json()}function show(title,msg,buttons){root.innerHTML='<section class="hero"><h1>'+esc(title)+'</h1><div class="status">'+esc(msg)+'</div>'+(buttons||'')+'</section>'}function query(){const p=[];p.push('language=en-US','region=US','include_adult=false','include_video=false','sort_by=popularity.desc','vote_count.gte=100');if(prefs?.vibe==='laugh')p.push('with_genres=35');if(prefs?.vibe==='hooked')p.push('with_genres=53|80|9648');if(prefs?.vibe==='think')p.push('with_genres=878|9648|18');if(prefs?.vibe==='feeling')p.push('with_genres=18|10749|35');if(prefs?.vibe==='freak')p.push('with_genres=27|53');if(prefs?.time==='short')p.push('with_runtime.lte=90');if(prefs?.time==='mid')p.push('with_runtime.gte=90','with_runtime.lte=120');if(prefs?.time==='long')p.push('with_runtime.gte=120');if(Array.isArray(prefs?.services)&&prefs.services.length)p.push('watch_region=US','with_watch_providers='+prefs.services.filter(x=>x!=='EVERYWHERE').join('|'));return p.join('&')}function blocked(){const rejected=new Set(JSON.parse(localStorage.getItem('maxRejected')||'[]').map(Number));const recent=new Set(JSON.parse(localStorage.getItem('maxRecent')||'[]').map(Number));const later=JSON.parse(localStorage.getItem('maxLater')||'[]');const notToday=new Set(later.filter(x=>x.reason==='not-today'&&Date.now()-x.added<3*86400000).map(x=>Number(x.id)));return{rejected,recent,notToday}}async function run(){if(!token()){show('TMDB is not connected','Open Settings to reconnect.','<a class="link primary" href="./settings.html">Open Settings</a><a class="link" href="./index.html">Back to MAX</a>');return}if(!prefs){show('Let’s start fresh','MAX doesn’t have your previous preferences yet.','<a class="link primary" href="./pick.html">Start MAX Pick</a>');return}show('MAX is thinking…','Finding another match using your last choices.');try{const type=prefs.type==='tv'?'tv':'movie',d=await api('/discover/'+type+'?'+query()+'&page=1'),{rejected,recent,notToday}=blocked();let items=(d.results||[]).filter(x=>!rejected.has(Number(x.id))&&!notToday.has(Number(x.id))&&!recent.has(Number(x.id)));if(items.length<3)items=(d.results||[]).filter(x=>!rejected.has(Number(x.id))&&!notToday.has(Number(x.id)));if(!items.length)throw Error('No other matches found for those preferences.');items.sort((a,b)=>(b.vote_average||0)-(a.vote_average||0));const top=items.slice(0,10),pick=top[Math.floor(Math.random()*top.length)],history=[Number(pick.id),...Array.from(recent).filter(id=>Number(id)!==Number(pick.id))].slice(0,12);localStorage.setItem('maxRecent',JSON.stringify(history));location.href='./detail.html?id='+pick.id+'&type='+type}catch(err){show('MAX hit a snag',err.message+'.','<a class="link primary" href="./pick.html">Run preferences again</a><a class="link" href="./index.html">Back to MAX</a>')}}run()})();</script></body></html>

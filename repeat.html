<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07080b"><title>MAX — Another Pick</title><style>body{margin:0;background:#07080b;color:#f7f7f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;padding:20px 18px;background:radial-gradient(circle at 50% -10%,#292e39,#050609 65%)}.logo{text-align:center;font-weight:900;letter-spacing:8px;font-size:22px}.tag{text-align:center;color:#9da1aa;font-size:12px}.hero{text-align:center;margin-top:20vh}.hero h1{font-size:31px;margin:0 0 10px}.small{color:#9da1aa;font-size:13px;line-height:1.45}.status{padding:13px;border:1px solid #2a2d35;border-radius:14px;background:#101217;margin:18px 0}.link{display:block;width:100%;padding:16px;margin:6px 0;border-radius:16px;border:1px solid #2a2d35;background:#15171c;color:#fff;font-size:16px;font-weight:650;text-decoration:none;text-align:center;box-sizing:border-box}.primary{background:#f5f5f7;color:#08090b}</style></head><body><div class="app"><div class="logo">MAX</div><div class="tag">Your personal movie concierge.</div><main id="root"></main></div><script>(function(){'use strict';const API='https://api.themoviedb.org/3',token=()=>localStorage.getItem('maxTmdbToken')||'',root=document.getElementById('root');const prefs=(()=>{try{return JSON.parse(localStorage.getItem('maxLastPreferences')||'null')}catch(_){return null}})();const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||d)}catch(_){return JSON.parse(d)}};function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(t,m,b){root.innerHTML='<section class="hero"><h1>'+esc(t)+'</h1><div class="status">'+esc(m)+'</div>'+b+'</section>'}async function api(path){if(!token())throw Error('TMDB is not connected.');const r=await fetch(API+path,{headers:{Authorization:'Bearer '+token()}});if(!r.ok)throw Error('TMDB returned '+r.status);return r.json()}function genreIds(){const v=prefs?.vibe;return v==='laugh'?[35]:v==='hooked'?[53,80,9648]:v==='think'?[878,9648,18]:v==='feeling'?[18,10749,35]:v==='freak'?[27,53]:[]}function query(page){const q=['language=en-US','region=US','include_adult=false','include_video=false','sort_by=popularity.desc','vote_count.gte=100','page='+page];const g=genreIds();if(g.length)q.push('with_genres='+g.join('|'));if(prefs?.time==='short')q.push('with_runtime.lte=90');if(prefs?.time==='mid')q.push('with_runtime.gte=90','with_runtime.lte=120');if(prefs?.time==='long')q.push('with_runtime.gte=120');const s=(prefs?.services||[]).filter(x=>x&&x!=='EVERYWHERE');if(s.length)q.push('watch_region=US','with_watch_providers='+s.join('|'));return q.join('&')}function state(){const rejected=new Set(read('maxRejected','[]').map(Number)),recent=new Set(read('maxRecent','[]').map(Number)),later=read('maxLater','[]'),notToday=new Set(later.filter(x=>x.reason==='not-today'&&Date.now()-x.added<3*86400000).map(x=>Number(x.id)));return{rejected,recent,notToday}}function score(x,st){const ids=x.genre_ids||[],wanted=new Set(genreIds()),rg=read('maxRecentGenres','{}'),taste=read('maxGenreTaste','{}');let s=(x.vote_average||0)*9+Math.log10((x.vote_count||1)+1)*3+(x.popularity||0)/25;s+=ids.reduce((n,id)=>n+(wanted.has(id)?18:0),0);s+=ids.reduce((n,id)=>n+Number(taste[id]||0)*8,0);s-=ids.reduce((n,id)=>n+Number(rg[id]||0)*8,0);s+=Math.random()*18;return s}function serviceNames(ids){return ids.map(x=>({'8':'Netflix','9':'Prime Video','15':'Hulu','337':'Disney+','1899':'Max','531':'Paramount+','386':'Peacock','350':'Apple TV+'}[x]||'your service'))}function offer(){const existing=(prefs?.services||[]).filter(x=>x&&x!=='EVERYWHERE');const all=['8','9','15','337','1899','531','386','350'];if(all.every(x=>existing.includes(x)))return false;const first=serviceNames(existing)[0]||'your current services';show('MAX is running low','We’ve tried several matches on '+first+'. Want to open up the search?', '<a class="link primary" href="./services.html?v=097">＋ Add another streaming service</a><a class="link" href="./repeat.html?v='+Date.now()+'&keepServices=1">Keep searching here</a>');return true}async function run(){if(!prefs){show('Let’s start fresh','MAX doesn’t have your previous preferences yet.','<a class="link primary" href="./pick.html">Start MAX Pick</a><a class="link" href="./index.html">Back to MAX</a>');return}const url=new URLSearchParams(location.search),streak=Number(localStorage.getItem('maxNoWatchStreak')||0),added=url.has('serviceAdded'),keep=url.has('keepServices');if(keep)localStorage.setItem('maxNoWatchStreak','0');if(streak>=7&&!added&&!keep&&offer())return;show('MAX is thinking…','Looking beyond the usual shortlist.');try{const type=prefs.type==='tv'?'tv':'movie',st=state(),all=[];for(let page=1;page<=6;page++){const d=await api('/discover/'+type+'?'+query(page));all.push(...(d.results||[]));if(!d.total_pages||page>=Math.min(d.total_pages,6))break}let candidates=all.filter(x=>!st.rejected.has(Number(x.id))&&!st.notToday.has(Number(x.id))&&!st.recent.has(Number(x.id)));if(!candidates.length)candidates=all.filter(x=>!st.rejected.has(Number(x.id))&&!st.notToday.has(Number(x.id)));if(!candidates.length)throw Error('MAX could not find another match for those preferences.');candidates.sort((a,b)=>score(b,st)-score(a,st));const top=candidates.slice(0,20),pick=top[Math.floor(Math.random()*top.length)],history=[Number(pick.id),...Array.from(st.recent).filter(id=>Number(id)!==Number(pick.id))].slice(0,20),rg=read('maxRecentGenres','{}');(pick.genre_ids||[]).forEach(id=>rg[id]=Math.min(5,Number(rg[id]||0)+1));localStorage.setItem('maxRecent',JSON.stringify(history));localStorage.setItem('maxRecentGenres',JSON.stringify(rg));location.href='./detail.html?id='+pick.id+'&type='+type}catch(err){show('MAX hit a snag',err.message+'.','<a class="link primary" href="./pick.html">Run preferences again</a><a class="link" href="./index.html">Back to MAX</a>')}}run()})();</script></body></html>

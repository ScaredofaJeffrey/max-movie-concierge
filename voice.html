<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07080b"><title>MAX Voice</title><style>body{margin:0;background:#07080b;color:#f7f7f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;padding:20px 18px;background:radial-gradient(circle at 50% -10%,#292e39,#050609 65%)}.logo{text-align:center;font-weight:900;letter-spacing:8px;font-size:22px}.tag{text-align:center;color:#9da1aa;font-size:12px}.top{margin:20px 0}.link,button{display:block;width:100%;padding:16px;margin:6px 0;border-radius:16px;border:1px solid #2a2d35;background:#15171c;color:#fff;font-size:16px;font-weight:650;text-decoration:none;text-align:center;box-sizing:border-box;cursor:pointer}.voice{border-radius:50%;width:120px;height:120px;margin:32px auto 20px;font-size:34px}.listening{box-shadow:0 0 0 8px #24262d,0 0 0 16px #17191e}.speaking{box-shadow:0 0 0 8px #24262d,0 0 0 16px #3a3d46}.card{padding:16px;border:1px solid #2a2d35;border-radius:18px;background:#101217;margin-top:18px}.phrase{font-size:22px;font-weight:750;line-height:1.2}.status{padding:13px;border:1px solid #2a2d35;border-radius:14px;background:#101217;margin:12px 0}.row{display:flex;gap:8px}.row button{flex:1}.ok{background:#f5f5f7;color:#08090b}.small{color:#9da1aa;font-size:13px}.footer{text-align:center;color:#666a73;font-size:10px;margin-top:20px}.toggle{display:flex;align-items:center;justify-content:space-between;text-align:left}.switch{width:52px;height:30px;border-radius:20px;padding:0;margin:0;position:relative}.switch.on{background:#f5f5f7}.switch.off{background:#15171c}.switch:after{content:'';position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#f5f5f7;transition:.15s}.switch.on:after{left:26px;background:#08090b}.toggle.off{opacity:.55}.resultCard{padding:16px;border:1px solid #2a2d35;border-radius:18px;background:#101217;margin-top:18px}.poster{width:100%;max-height:430px;object-fit:cover;border-radius:14px}.title{font-size:30px;font-weight:850;margin-top:12px}.maxSays{padding:14px 16px;border:1px solid #2a2d35;border-radius:16px;background:#15171c;margin:14px 0;font-size:15px;line-height:1.45}.reaction{background:#101217}</style></head><body><div class="app"><div class="logo">MAX</div><div class="tag">Your personal movie concierge.</div><div class="top"><a class="link" href="./index.html">‹ Home</a></div><section><div id="status" class="status">Tap the microphone and tell MAX what you want to watch.</div><button id="mic" class="voice" type="button">🎙️</button><button id="auto" class="toggle" type="button"><span><strong id="autoLabel">🔊 MAX voice replies</strong><span class="small" id="autoText"></span></span><span class="switch" id="switch"></span></button><div class="small">Tap the microphone for one request. MAX stops listening as soon as the request is captured.</div><div id="heard" class="card" hidden></div><div id="actions"></div><div id="result"></div></section><div class="footer">MAX voice concierge preview</div></div><script>(function(){'use strict';const API='https://api.themoviedb.org/3',IMG='https://image.tmdb.org/t/p/w780',SR=window.SpeechRecognition||window.webkitSpeechRecognition,status=document.getElementById('status'),mic=document.getElementById('mic'),auto=document.getElementById('auto'),sw=document.getElementById('switch'),autoText=document.getElementById('autoText'),autoLabel=document.getElementById('autoLabel'),heard=document.getElementById('heard'),actions=document.getElementById('actions'),result=document.getElementById('result');let recognition=null,voiceOn=localStorage.getItem('maxVoiceReplies')==='off'?false:true,lastReply='I’m ready. Tell me what you want to watch.';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function refreshToggle(){voiceOn=localStorage.getItem('maxVoiceReplies')!=='off';sw.className='switch '+(voiceOn?'on':'off');auto.className='toggle '+(voiceOn?'':'off');autoLabel.textContent=voiceOn?'🔊 MAX voice replies':'🔇 MAX voice replies';autoText.textContent=voiceOn?'On — MAX will speak replies automatically.':'Off — MAX replies stay in text.'}function getVoice(){try{const v=speechSynthesis.getVoices()||[];return v.find(x=>/^en(-|_)?US$/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||v[0]||null}catch(_){return null}}function speak(text){lastReply=text;if(!voiceOn||!('speechSynthesis'in window))return false;try{speechSynthesis.cancel();speechSynthesis.resume();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.95;u.pitch=1;u.volume=1;const v=getVoice();if(v)u.voice=v;mic.classList.add('speaking');u.onend=u.onerror=()=>mic.classList.remove('speaking');speechSynthesis.speak(u);return true}catch(_){mic.classList.remove('speaking');return false}}function stop(){const r=recognition;recognition=null;if(r){try{r.onresult=r.onerror=r.onend=null;r.stop()}catch(_){try{r.abort()}catch(__){}}}mic.classList.remove('listening')}function parse(s){s=s.toLowerCase();const p={type:/\b(tv|show|series|television)\b/.test(s)?'tv':'movie',vibe:/funny|comedy|laugh/.test(s)?'laugh':/thriller|suspense|mystery|hooked|edge of my seat/.test(s)?'hooked':/smart|thought|think|sci-fi|science fiction/.test(s)?'think':/romantic|romance|feel good|emotional/.test(s)?'feeling':/scary|horror|creepy|freak me out/.test(s)?'freak':'surprise',time:/under 90|less than 90|90 minutes or less|short/.test(s)?'short':/90\s*(to|-|–)\s*120|between 90 and 120|under two hours|two hours/.test(s)?'mid':/over two hours|more than two hours|2\+ hours|long/.test(s)?'long':'any',novelty:/new|recent|newer/.test(s)?'new':/old|classic|comfort|familiar/.test(s)?'comfort':'surprise',services:[]};[['Netflix','8'],['Prime Video','9'],['Hulu','15'],['Disney+','337'],['Max','1899'],['Paramount+','531'],['Peacock','386'],['Apple TV+','350']].forEach(([n,id])=>{if(s.includes(n.toLowerCase()))p.services.push(id)});return p}function summary(p){const t=p.type==='tv'?'TV':'movie',v={laugh:'funny',hooked:'thrilling',think:'thought-provoking',feeling:'emotional',freak:'scary',surprise:'unexpected'},tm={short:'under 90 minutes',mid:'about 90 to 120 minutes',long:'over two hours',any:'any length'},n={new:'something newer',comfort:'something familiar',surprise:'something different'};return 'Got it — '+t+', '+v[p.vibe]+', '+tm[p.time]+', and '+n[p.novelty]+'.'}function genres(v){return v==='laugh'?[35]:v==='hooked'?[53,80,9648]:v==='think'?[878,9648,18]:v==='feeling'?[18,10749,35]:v==='freak'?[27,53]:[]}function read(k,d){try{return JSON.parse(localStorage.getItem(k)||d)}catch(_){return JSON.parse(d)}}function excluded(){const r=new Set(read('maxRejected','[]').map(Number)),recent=new Set(read('maxRecent','[]').map(Number)),later=read('maxLater','[]'),nt=new Set(later.filter(x=>x.reason==='not-today'&&Date.now()-x.added<3*86400000).map(x=>Number(x.id)));return{r,recent,nt}}function pickScore(x,p){const ids=x.genre_ids||[],w=new Set(genres(p.vibe)),taste=read('maxGenreTaste','{}'),rg=read('maxRecentGenres','{}');let s=(x.vote_average||0)*9+Math.log10((x.vote_count||1)+1)*3+(x.popularity||0)/25;s+=ids.reduce((n,id)=>n+(w.has(id)?18:0),0);s+=ids.reduce((n,id)=>n+Number(taste[id]||0)*8,0);s-=ids.reduce((n,id)=>n+Number(rg[id]||0)*8,0);if(p.novelty==='new')s+=Number((x.release_date||x.first_air_date||'').slice(0,4))>=2020?9:0;if(p.novelty==='comfort')s+=Number((x.release_date||x.first_air_date||'').slice(0,4))<2020?8:0;return s+Math.random()*18}async function api(path){const t=localStorage.getItem('maxTmdbToken')||'';if(!t)throw Error('TMDB is not connected.');const r=await fetch(API+path,{headers:{Authorization:'Bearer '+t}});if(!r.ok)throw Error('TMDB returned '+r.status);return r.json()}async function recommend(p){status.textContent='MAX is thinking…';result.innerHTML='';actions.innerHTML='';const st=excluded(),all=[],type=p.type==='tv'?'tv':'movie',q=['language=en-US','region=US','include_adult=false','include_video=false','sort_by=popularity.desc','vote_count.gte=100'],g=genres(p.vibe);if(g.length)q.push('with_genres='+g.join('|'));if(p.time==='short')q.push('with_runtime.lte=90');if(p.time==='mid')q.push('with_runtime.gte=90','with_runtime.lte=120');if(p.time==='long')q.push('with_runtime.gte=120');if(p.services.length)q.push('watch_region=US','with_watch_providers='+p.services.join('|'));for(let page=1;page<=6;page++){const d=await api('/discover/'+type+'?'+q.join('&')+'&page='+page);all.push(...(d.results||[]));if(!d.total_pages||page>=Math.min(6,d.total_pages))break}let items=all.filter(x=>!st.r.has(Number(x.id))&&!st.nt.has(Number(x.id))&&!st.recent.has(Number(x.id)));if(items.length<3)items=all.filter(x=>!st.r.has(Number(x.id))&&!st.nt.has(Number(x.id)));if(!items.length)throw Error('MAX could not find another match for those preferences.');items.sort((a,b)=>pickScore(b,p)-pickScore(a,p));const pick=items[Math.floor(Math.random()*Math.min(10,items.length))];localStorage.setItem('maxLastPreferences',JSON.stringify(p));localStorage.setItem('maxRecent',JSON.stringify([Number(pick.id),...st.recent].slice(0,20)));const rg=read('maxRecentGenres','{}');(pick.genre_ids||[]).forEach(id=>rg[id]=Math.min(5,Number(rg[id]||0)+1));localStorage.setItem('maxRecentGenres',JSON.stringify(rg));render(pick,p)}function render(item,p){const mood={laugh:'funny',hooked:'tense',think:'thought-provoking',feeling:'emotional',freak:'creepy',surprise:'unexpected'}[p.vibe]||'interesting',msg='Okay, I found you something '+mood+'. I think this one is worth a shot.';result.innerHTML='<div class="resultCard">'+(item.poster_path?'<img class="poster" src="'+IMG+item.poster_path+'">':'')+'<div class="title">'+esc(item.title||item.name)+'</div><p class="muted">'+esc((item.release_date||item.first_air_date||'').slice(0,4))+' · TMDB '+(item.vote_average?item.vote_average.toFixed(1):'—')+'/10</p><p class="small">'+esc(item.overview||'MAX found this for you.')+'</p></div><div class="maxSays"><strong>MAX says:</strong> '+esc(msg)+'</div><div class="actions"><button class="reaction" id="find">🎲 Find another</button><button class="reaction" id="later">🕐 Maybe another time</button><button class="reaction" id="today">🌙 Not today</button><button class="reaction" id="nope">👎 No, never</button></div>';if(voiceOn)speak(msg);document.getElementById('find').onclick=()=>{if(voiceOn)speak('Sure. I’ll find you another one.');recommend(p).catch(showErr)};document.getElementById('later').onclick=()=>{const a=read('maxLater','[]').filter(x=>Number(x.id)!==Number(item.id));a.push({id:Number(item.id),type:p.type,title:item.title||item.name,poster_path:item.poster_path||'',overview:item.overview||'',added:Date.now(),reason:'maybe'});localStorage.setItem('maxLater',JSON.stringify(a));if(voiceOn)speak('No problem. I’ll save this one for later and find you another.');recommend(p).catch(showErr)};document.getElementById('today').onclick=()=>{const h=read('maxReactionHistory','[]');h.unshift({id:Number(item.id),reason:'not-today',at:Date.now()});localStorage.setItem('maxReactionHistory',JSON.stringify(h.slice(0,30)));if(voiceOn)speak('Got it. Not tonight. I’ll try something else.');recommend(p).catch(showErr)};document.getElementById('nope').onclick=()=>{const r=new Set(read('maxRejected','[]').map(Number));r.add(Number(item.id));localStorage.setItem('maxRejected',JSON.stringify([...r]));if(voiceOn)speak('Understood. I won’t recommend that one again.');recommend(p).catch(showErr)}}function showErr(e){status.textContent='MAX hit a snag.';result.innerHTML='<div class="status">'+esc(e.message)+'</div>'}function start(){if(!SR){status.textContent='Voice input is not available in this browser. Use Search or MAX Pick instead.';return}stop();const r=new SR();recognition=r;r.lang='en-US';r.interimResults=false;r.continuous=false;mic.classList.add('listening');status.textContent='I’m listening…';r.onresult=e=>{const text=e.results?.[0]?.[0]?.transcript||'';stop();const p=parse(text);lastReply=summary(p);heard.hidden=false;heard.innerHTML='<div class="phrase">“'+esc(text)+'”</div><div class="small" style="margin-top:8px">'+esc(lastReply)+'</div>';status.textContent='Got it. I’m finding a match.';if(voiceOn)speak(lastReply);recommend(p).catch(showErr)};r.onerror=()=>{stop();status.textContent='MAX couldn’t hear that. Tap the microphone and try again.'};r.onend=()=>{if(recognition===r){recognition=null;mic.classList.remove('listening')}};try{r.start()}catch(_){stop();status.textContent='MAX could not start voice input. Please tap the microphone again.'}}auto.onclick=()=>{voiceOn=!voiceOn;localStorage.setItem('maxVoiceReplies',voiceOn?'on':'off');if(!voiceOn&&'speechSynthesis'in window)speechSynthesis.cancel();refreshToggle()};mic.onclick=start;refreshToggle();window.addEventListener('pagehide',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});if('speechSynthesis'in window&&typeof speechSynthesis.onvoiceschanged!=='undefined')speechSynthesis.onvoiceschanged=()=>getVoice()})();</script></body></html>

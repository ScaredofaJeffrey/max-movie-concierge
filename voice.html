<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAX Voice</title><style>body{margin:0;background:#07080b;color:#f7f7f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;padding:20px 18px;background:radial-gradient(circle at 50% -10%,#292e39,#050609 65%)}.logo{text-align:center;font-weight:900;letter-spacing:8px;font-size:22px}.tag{text-align:center;color:#9da1aa;font-size:12px}.top{margin:20px 0}.link,button{display:block;width:100%;padding:16px;margin:6px 0;border-radius:16px;border:1px solid #2a2d35;background:#15171c;color:#fff;font-size:16px;font-weight:650;text-decoration:none;text-align:center;box-sizing:border-box;cursor:pointer}.primary{background:#f5f5f7;color:#08090b}.voice{border-radius:50%;width:120px;height:120px;margin:32px auto 20px;font-size:34px}.listening{box-shadow:0 0 0 8px #24262d,0 0 0 16px #17191e}.card{padding:16px;border:1px solid #2a2d35;border-radius:18px;background:#101217;margin-top:18px}.status{padding:13px;border:1px solid #2a2d35;border-radius:14px;background:#101217;margin:12px 0}.phrase{font-size:22px;font-weight:750;line-height:1.2}.row{display:flex;gap:8px}.row button{flex:1}.footer{text-align:center;color:#666a73;font-size:10px;margin-top:20px}</style></head><body><div class="app"><div class="logo">MAX</div><div class="tag">Your personal movie concierge.</div><div class="top"><a class="link" href="./index.html">‹ Home</a></div><div id="status" class="status">Tap the microphone and tell MAX what you want to watch.</div><button id="mic" class="voice">🎙️</button><div class="footer">Try: “Give me a funny movie under two hours on Netflix.”</div><div id="heard" class="card" hidden></div><div id="actions"></div></div><script>(function(){'use strict';const SR=window.SpeechRecognition||window.webkitSpeechRecognition,status=document.getElementById('status'),mic=document.getElementById('mic'),heard=document.getElementById('heard'),actions=document.getElementById('actions');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function parse(s){s=s.toLowerCase();const p={type:/\b(tv|show|series|television)\b/.test(s)?'tv':'movie',vibe:/funny|comedy|laugh/.test(s)?'laugh':/thriller|suspense|mystery|hooked/.test(s)?'hooked':/smart|thought|think|sci-fi|science fiction/.test(s)?'think':/romantic|romance|feel good|emotional/.test(s)?'feeling':/scary|horror|creepy/.test(s)?'freak':/surprise|anything/.test(s)?'surprise':'surprise',time:/under 90|less than 90|90 minutes or less|short/.test(s)?'short':/90\s*(to|-|–)\s*120|between 90 and 120|under two hours|two hours/.test(s)?'mid':/over two hours|more than two hours|2\+ hours|long/.test(s)?'long':'any',novelty:/new|recent|newer/.test(s)?'new':/old|classic|comfort|familiar/.test(s)?'comfort':'surprise',services:[]};[['Netflix','8'],['Prime Video','9'],['Hulu','15'],['Disney+','337'],['Max','1899'],['Paramount+','531'],['Peacock','386'],['Apple TV+','350']].forEach(([n,id])=>{if(s.includes(n.toLowerCase()))p.services.push(id)});return p}function start(){if(!SR){status.textContent='Voice input is not available in this browser. Use Search or MAX Pick instead.';return}const r=new SR();r.lang='en-US';r.interimResults=false;r.continuous=false;mic.classList.add('listening');status.textContent='I’m listening…';r.onresult=e=>{const text=e.results[0][0].transcript||'';heard.hidden=false;heard.innerHTML='<div class="phrase">“'+esc(text)+'”</div>';status.textContent='Got it. MAX is ready to use that request.';actions.innerHTML='<div class="row"><button id="use" class="primary">Use this</button><button id="edit">Start Pick</button></div>';document.getElementById('use').onclick=()=>{const p=parse(text),q=new URLSearchParams({voice:'1',step:'go',type:p.type,vibe:p.vibe,time:p.time,novelty:p.novelty});if(p.services.length)q.set('services',p.services.join(','));location.href='./pick.html?'+q.toString()};document.getElementById('edit').onclick=()=>location.href='./pick.html'};r.onerror=()=>status.textContent='MAX couldn’t hear that. Tap the microphone and try again.';r.onend=()=>mic.classList.remove('listening');r.start()}mic.onclick=start})()</script></body></html>

<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07080b">
    <title>MAX Voice</title>
    <link rel="stylesheet" href="./assets/max.css">
    <script src="./assets/voice.js" defer></script>
  </head>

  <body>
    <div class="app">
      <header>
        <div class="logo">MAX</div>
        <p class="tag">Your personal movie concierge.</p>
      </header>

      <main>
        <nav class="top" aria-label="MAX navigation">
          <a class="link back-link" href="./index.html">‹ Home</a>
        </nav>

        <section aria-labelledby="voice-title">
          <h1 id="voice-title" class="visually-hidden">Talk to MAX</h1>

          <div id="status" class="status" aria-live="polite">
            Tap the microphone and tell MAX what you want to watch.
          </div>

          <button id="mic" class="voice" type="button" aria-label="Talk to MAX">
            🎙️
          </button>

          <button id="auto" class="toggle" type="button" aria-pressed="true">
            <span>
              <strong id="autoLabel">🔊 MAX voice replies</strong>
              <span class="small" id="autoText"></span>
            </span>
            <span class="switch" id="switch" aria-hidden="true"></span>
          </button>

          <p class="small">
            Tap the microphone for one request. MAX stops listening as soon as the request is captured.
          </p>

          <div id="heard" class="card" hidden></div>
          <div id="actions"></div>
          <div id="result"></div>
        </section>
      </main>

      <footer class="footer">MAX voice concierge</footer>
    </div>
  </body>
</html>

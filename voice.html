<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAX Voice</title><style>body{margin:0;background:#07080b;color:#f7f7f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;padding:20px 18px;background:radial-gradient(circle at 50% -10%,#292e39,#050609 65%)}.logo{text-align:center;font-weight:900;letter-spacing:8px;font-size:22px}.tag{text-align:center;color:#9da1aa;font-size:12px}.top{margin:20px 0}.link,button{display:block;width:100%;padding:16px;margin:6px 0;border-radius:16px;border:1px solid #2a2d35;background:#15171c;color:#fff;font-size:16px;font-weight:650;text-decoration:none;text-align:center;box-sizing:border-box;cursor:pointer}.primary{background:#f5f5f7;color:#08090b}.voice{border-radius:50%;width:120px;height:120px;margin:32px auto 20px;font-size:34px}.listening{box-shadow:0 0 0 8px #24262d,0 0 0 16px #17191e}.card{padding:16px;border:1px solid #2a2d35;border-radius:18px;background:#101217;margin-top:18px}.phrase{font-size:22px;font-weight:750;line-height:1.2}.status{padding:13px;border:1px solid #2a2d35;border-radius:14px;background:#101217;margin:12px 0}.row{display:flex;gap:8px}.row button{flex:1}.ok{background:#f5f5f7;color:#08090b}.small{color:#9da1aa;font-size:13px}.footer{text-align:center;color:#666a73;font-size:10px;margin-top:20px}.speech{margin-top:12px}.speaking{box-shadow:0 0 0 4px #24262d}</style></head><body><div class="app"><div class="logo">MAX</div><div class="tag">Your personal movie concierge.</div><div class="top"><a class="link" href="./index.html">‹ Home</a></div><section><div id="status" class="status">Tap the microphone and tell MAX what you want to watch.</div><button id="mic" class="voice">🎙️</button><div class="small">Try: “Give me a funny movie under two hours on Netflix.”</div><div id="heard" class="card" hidden></div><div id="actions"></div></section></div><script>(function(){'use strict';const SR=window.SpeechRecognition||window.webkitSpeechRecognition,status=document.getElementById('status'),mic=document.getElementById('mic'),heard=document.getElementById('heard'),actions=document.getElementById('actions');let lastReply='';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function speak(text){lastReply=text;try{if(!('speechSynthesis' in window)){return false}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.98;u.pitch=1;u.volume=1;u.onstart=()=>{mic.classList.add('speaking')};u.onend=()=>{mic.classList.remove('speaking')};u.onerror=()=>{mic.classList.remove('speaking')};window.speechSynthesis.speak(u);return true}catch(_){return false}}function ensureAudioButton(text){const old=document.getElementById('hear');if(old)old.remove();const b=document.createElement('button');b.id='hear';b.className='speech';b.textContent='🔊 Hear MAX';b.onclick=()=>speak(text);actions.prepend(b)}function parse(s){s=s.toLowerCase();const p={type:null,vibe:null,time:null,novelty:null,services:[]};if(/\b(tv|show|series|television)\b/.test(s))p.type='tv';else if(/\b(movie|film)\b/.test(s))p.type='movie';else p.type='movie';if(/funny|comedy|laugh/.test(s))p.vibe='laugh';else if(/thriller|suspense|mystery|hooked|edge of my seat/.test(s))p.vibe='hooked';else if(/smart|thought|think|sci-fi|science fiction/.test(s))p.vibe='think';else if(/romantic|romance|feel good|emotional/.test(s))p.vibe='feeling';else if(/scary|horror|creepy|freak me out/.test(s))p.vibe='freak';else p.vibe='surprise';if(/under 90|less than 90|90 minutes or less|short/.test(s))p.time='short';else if(/90\s*(to|-|–)\s*120|between 90 and 120|under two hours|two hours/.test(s))p.time='mid';else if(/over two hours|more than two hours|2\+ hours|long/.test(s))p.time='long';else p.time='any';if(/new|recent|newer/.test(s))p.novelty='new';else if(/old|classic|comfort|familiar/.test(s))p.novelty='comfort';else p.novelty='surprise';[['Netflix','8'],['Prime Video','9'],['Hulu','15'],['Disney+','337'],['Max','1899'],['Paramount+','531'],['Peacock','386'],['Apple TV+','350']].forEach(([n,id])=>{if(s.includes(n.toLowerCase()))p.services.push(id)});return p}function summary(p){const type=p.type==='tv'?'TV':'movie',vibes={laugh:'funny',hooked:'thrilling',think:'thought-provoking',feeling:'emotional',freak:'scary',surprise:'surprising'},times={short:'under 90 minutes',mid:'about 90 to 120 minutes',long:'over two hours',any:'any length'},nov={new:'something newer',comfort:'something familiar',surprise:'something different'},svc=p.services.length?' on '+p.services.map(x=>({'8':'Netflix','9':'Prime Video','15':'Hulu','337':'Disney+','1899':'Max','531':'Paramount+','386':'Peacock','350':'Apple TV+'}[x]||'your service')).join(' or '):'';return 'Gotcha. You want a '+type+' that feels '+vibes[p.vibe]+', '+times[p.time]+', and '+nov[p.novelty]+svc+'. Let me find you something.'}function start(){if(!SR){status.textContent='Voice input is not available in this browser. Use Search or MAX Pick instead.';return}const r=new SR();r.lang='en-US';r.interimResults=false;r.continuous=false;mic.classList.add('listening');status.textContent='I’m listening…';r.onresult=e=>{const text=e.results[0][0].transcript||'',p=parse(text),msg=summary(p);heard.hidden=false;heard.innerHTML='<div class="phrase">“'+esc(text)+'”</div><div class="small" style="margin-top:8px">'+esc(msg)+'</div>';status.textContent=msg;actions.innerHTML='<div class="row"><button id="use" class="ok">Use this</button><button id="edit">Start Pick</button></div>';ensureAudioButton(msg);speak(msg);document.getElementById('use').onclick=()=>{const q=new URLSearchParams({voice:'1',step:'go',type:p.type,vibe:p.vibe,time:p.time,novelty:p.novelty});if(p.services.length)q.set('services',p.services.join(','));location.href='./pick.html?'+q.toString()};document.getElementById('edit').onclick=()=>location.href='./pick.html'};r.onerror=()=>{status.textContent='MAX couldn’t hear that. Tap the microphone and try again.'};r.onend=()=>mic.classList.remove('listening');try{r.start()}catch(_){status.textContent='MAX could not start voice input. Please tap the microphone again.'}}mic.onclick=start})()</script></body></html>

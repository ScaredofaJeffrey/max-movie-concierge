<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07080b"><title>MAX — Voice Concierge</title><style>body{margin:0;background:#07080b;color:#f7f7f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;padding:20px 18px;background:radial-gradient(circle at 50% -10%,#292e39,#050609 65%)}.logo{text-align:center;font-weight:900;letter-spacing:8px;font-size:22px}.tag,.muted,.small{color:#9da1aa;font-size:13px}.tag{text-align:center;font-size:12px}.top{margin:20px 0}.link,button{display:block;width:100%;padding:16px;margin:6px 0;border-radius:16px;border:1px solid #2a2d35;background:#15171c;color:#fff;font-size:16px;font-weight:650;text-decoration:none;text-align:center;box-sizing:border-box;cursor:pointer}.primary{background:#f5f5f7;color:#08090b}.voice{border-radius:50%;width:120px;height:120px;margin:32px auto 20px;font-size:34px}.listening{box-shadow:0 0 0 8px #24262d,0 0 0 16px #17191e}.card{padding:16px;border:1px solid #2a2d35;border-radius:18px;background:#101217;margin-top:18px}.phrase{font-size:22px;font-weight:750;line-height:1.2}.status{padding:13px;border:1px solid #2a2d35;border-radius:14px;background:#101217;margin:12px 0}.row{display:flex;gap:8px}.row button{flex:1}.ok{background:#f5f5f7;color:#08090b}.footer{text-align:center;color:#666a73;font-size:10px;margin-top:20px}</style></head><body><div class="app"><div class="logo">MAX</div><div class="tag">Your personal movie concierge.</div><div class="top"><a class="link" href="./index.html">‹ Home</a></div><section><div id="status" class="status">Tap the microphone and tell MAX what you want to watch.</div><button id="mic" class="voice">🎙️</button><div class="small">Try: “Give me a funny movie under two hours on Netflix.”</div><div id="heard" class="card" hidden></div><div id="actions"></div></section></div><script>(function(){'use strict';const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;const status=document.getElementById('status'),mic=document.getElementById('mic'),heard=document.getElementById('heard'),actions=document.getElementById('actions');let finalText='';function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function parse(text){const s=text.toLowerCase();const prefs={type:null,vibe:null,time:null,novelty:null,services:[]};if(/\b(tv|show|series|television)\b/.test(s))prefs.type='tv';else if(/\b(movie|film)\b/.test(s))prefs.type='movie';if(/funny|comedy|laugh/.test(s))prefs.vibe='laugh';else if(/thriller|suspense|hooked|edge of my seat|mystery/.test(s))prefs.vibe='hooked';else if(/smart|thought provoking|think|science fiction|sci-fi/.test(s))prefs.vibe='think';else if(/romantic|romance|feel good|heart|emotional|feeling/.test(s))prefs.vibe='feeling';else if(/scary|horror|creepy|freak me out/.test(s))prefs.vibe='freak';else if(/surprise me|anything|don't care|dont care/.test(s))prefs.vibe='surprise';if(/under 90|less than 90|90 minutes or less|short/.test(s))prefs.time='short';else if(/90\s*(to|-|–)\s*120|between 90 and 120|two hours/.test(s))prefs.time='mid';else if(/over two hours|more than two hours|2\+ hours|long movie/.test(s))prefs.time='long';if(/new|recent|202[0-9]|something newer/.test(s))prefs.novelty='new';else if(/old|classic|comfort|familiar/.test(s))prefs.novelty='comfort';const providers=[['Netflix','8'],['Prime Video','9'],['Hulu','15'],['Disney+','337'],['Max','1899'],['Paramount+','531'],['Peacock','386'],['Apple TV+','350']];providers.forEach(([name,id])=>{if(s.includes(name.toLowerCase()))prefs.services.push(id)});return prefs}function buildUrl(p){const q=new URLSearchParams();q.set('voice','1');Object.entries(p).forEach(([k,v])=>{if(Array.isArray(v)&&v.length)q.set(k,v.join(','));else if(v)q.set(k,v)});return './pick.html?'+q.toString()}function speak(text){try{if(window.speechSynthesis){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(text))}}catch(_){}}function start(){if(!Speech){status.textContent='Voice input is not available in this browser. Use Search or MAX Pick instead.';return}const r=new Speech();r.lang='en-US';r.interimResults=false;r.continuous=false;mic.classList.add('listening');status.textContent='I’m listening…';r.onresult=e=>{finalText=e.results[0][0].transcript||'';heard.hidden=false;heard.innerHTML='<div class="phrase">“'+esc(finalText)+'”</div>';const p=parse(finalText);const missing=[];if(!p.type)missing.push('movie or TV');if(!p.vibe)missing.push('a vibe');if(!p.time)missing.push('a time');if(!p.novelty)missing.push('new or familiar');if(!p.services.length)missing.push('where you can watch');status.textContent=missing.length?'I caught that. MAX can fill in the missing pieces for you.':'Got it. MAX can use those choices.';actions.innerHTML='<div class="row"><button id="use" class="ok">Use this</button><button id="edit">Start Pick</button></div>';document.getElementById('use').onclick=()=>{if(missing.length){const label=missing.slice(0,2).join(' and ');status.textContent='I’ll fill in '+label+' with a smart default, then MAX will choose.';speak('I’ll fill in the missing details and make a smart choice.');setTimeout(()=>location.href=buildUrl({...p,type:p.type||'movie',vibe:p.vibe||'surprise',time:p.time||'any',novelty:p.novelty||'surprise',services:p.services.length?p.services:[]}),350)}else location.href=buildUrl(p)};document.getElementById('edit').onclick=()=>location.href='./pick.html'};r.onerror=()=>{status.textContent='MAX couldn’t hear that. Tap the microphone and try again.'};r.onend=()=>mic.classList.remove('listening');r.start()}mic.onclick=start})()</script></body></html>

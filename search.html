<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAX Search</title><style>body{margin:0;background:#07080b;color:#f7f7f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;padding:20px 18px}.logo{text-align:center;font-weight:900;letter-spacing:8px;font-size:22px}.tag{text-align:center;color:#9da1aa;font-size:12px}.top{display:flex;justify-content:space-between;align-items:center;margin:20px 0}.back{color:#9da1aa;text-decoration:none}.input{width:100%;padding:14px;border-radius:14px;border:1px solid #2a2d35;background:#101217;color:white;font-size:16px;box-sizing:border-box}.button{display:block;width:100%;padding:14px;margin:7px 0;border-radius:14px;border:1px solid #2a2d35;background:#15171c;color:white;text-decoration:none;font-weight:650;box-sizing:border-box}.primary{background:#f5f5f7;color:#08090b}.section{margin-top:22px}.label{color:#8f939c;font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:9px 12px;border:1px solid #2a2d35;border-radius:999px;color:#f7f7f8;background:#101217;cursor:pointer}.chip.active{background:#f5f5f7;color:#08090b}.status{padding:12px;border-radius:12px;border:1px solid #2a2d35;background:#101217;color:#9da1aa}</style></head><body><div class="app"><div class="logo">MAX</div><div class="tag">Your personal movie concierge.</div><div class="top"><a class="back" href="./index.html?v=080">‹ Home</a><span>SEARCH</span></div><form id="f"><input class="input" id="q" name="q" enterkeyhint="search" autocomplete="off" placeholder="Movie, show, genre, actor, director..."><button class="button primary" type="submit">Search MAX</button></form><div class="section"><div class="label">Search by</div><div class="chips"><button type="button" class="chip active" data-mode="all">Everything</button><button type="button" class="chip" data-mode="genre">Genre</button><button type="button" class="chip" data-mode="person">Actor / Director</button></div></div><div id="results" style="margin-top:14px"></div></div><script>(function(){const API='https://api.themoviedb.org/3',token=()=>localStorage.getItem('maxTmdbToken')||'';let mode='all';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path){const r=await fetch(API+path,{headers:{Authorization:'Bearer '+token()}});if(!r.ok)throw Error('TMDB returned '+r.status);return r.json()}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('q').placeholder=mode==='genre'?'Genre, e.g. comedy, sci-fi, horror...':mode==='person'?'Actor or director, e.g. Tom Hanks...':'Movie, show, genre, actor, director...'});async function run(){const q=document.getElementById('q').value.trim(),out=document.getElementById('results');if(!q)return;if(!token()){out.innerHTML='<div class="status">Connect TMDB in Settings first.</div>';return}out.innerHTML='<div class="status">MAX is searching…</div>';try{let items=[];if(mode==='genre'){const g=await api('/genre/movie/list?language=en-US'),m=(g.genres||[]).find(x=>x.name.toLowerCase()===q.toLowerCase())||(g.genres||[]).find(x=>x.name.toLowerCase().includes(q.toLowerCase()));if(!m){out.innerHTML='<div class="status">No matching genre found. Try a genre such as Comedy, Horror, Action, or Science Fiction.</div>';return}const d=await api('/discover/movie?language=en-US&region=US&with_genres='+m.id+'&sort_by=popularity.desc&page=1');items=(d.results||[]).map(x=>({...x,media_type:'movie'})).slice(0,10)}else if(mode==='person'){const d=await api('/search/person?query='+encodeURIComponent(q)+'&language=en-US&page=1');const people=(d.results||[]).slice(0,3);if(!people.length){out.innerHTML='<div class="status">No actor or director found.</div>';return}for(const p of people){let c=await api('/person/'+p.id+'/combined_credits?language=en-US');items.push(...(c.cast||[]),...(c.crew||[]))}const seen=new Set();items=items.filter(x=>(x.media_type==='movie'||x.media_type==='tv')&&!seen.has(x.id)&&(seen.add(x.id))).sort((a,b)=>(b.popularity||0)-(a.popularity||0)).slice(0,10)}else{const d=await api('/search/multi?query='+encodeURIComponent(q)+'&include_adult=false&language=en-US&page=1');items=(d.results||[]).filter(x=>x.media_type==='movie'||x.media_type==='tv').slice(0,10)}out.innerHTML=items.map(x=>'<a class="button" href="./detail.html?id='+x.id+'&type='+x.media_type+'">'+esc(x.title||x.name)+' <span style="color:#9da1aa">· '+(x.media_type==='tv'?'TV':'Movie')+'</span></a>').join('')||'<div class="status">MAX couldn’t find that.</div>'}catch(e){out.innerHTML='<div class="status">'+esc(e.message)+'</div>'}}document.getElementById('f').onsubmit=e=>{e.preventDefault();run()};const p=new URLSearchParams(location.search);if(p.get('q')){document.getElementById('q').value=p.get('q');run()}})();</script></body></html>

<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07080b">
    <title>MAX Search</title>
    <link rel="stylesheet" href="./assets/max.css">
    <script src="./assets/search.js" defer></script>
  </head>

  <body>
    <div class="app">
      <header>
        <div class="logo">MAX</div>
        <p class="tag">Your personal movie concierge.</p>
      </header>

      <main>
        <nav class="top" aria-label="MAX navigation">
          <a class="link back-link" href="./index.html">‹ Home</a>
          <span aria-hidden="true">SEARCH</span>
        </nav>

        <section aria-labelledby="search-title">
          <h1 id="search-title">Search MAX</h1>

          <form id="search-form">
            <label class="visually-hidden" for="q">Search for a movie, show, genre, actor, or director</label>
            <input
              class="input"
              id="q"
              name="q"
              type="search"
              enterkeyhint="search"
              autocomplete="off"
              placeholder="Movie, show, genre, actor, director..."
            >
            <button class="button primary" type="submit">Search MAX</button>
          </form>

          <div id="results" class="results" aria-live="polite"></div>
        </section>
      </main>
    </div>
  </body>
</html>

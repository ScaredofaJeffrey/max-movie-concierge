<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07080b"><title>MAX Search</title><style>body{margin:0;background:#07080b;color:#f7f7f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;padding:20px 18px;background:#07080b}.logo{text-align:center;font-weight:900;letter-spacing:8px;font-size:22px}.tag,.muted,.small{color:#9da1aa;font-size:13px}.tag{text-align:center;font-size:12px}.top{margin:22px 0}.link,button{display:block;width:100%;padding:16px;margin:6px 0;border-radius:16px;border:1px solid #2a2d35;background:#15171c;color:#fff;font-size:16px;font-weight:650;text-decoration:none;text-align:center;box-sizing:border-box}.primary{background:#f5f5f7;color:#08090b}.input{width:100%;padding:14px;border-radius:14px;border:1px solid #2a2d35;background:#101217;color:#fff;font-size:16px;box-sizing:border-box}.results{margin-top:16px}</style></head><body><div class="app"><div class="logo">MAX</div><div class="tag">Your personal movie concierge.</div><div class="top"><a class="link" href="./index.html">‹ Home</a></div><h1>Search MAX</h1><p class="muted">Find a movie or show directly.</p><form id="f" action="search.html" method="get"><input class="input" id="q" name="q" enterkeyhint="search" autocomplete="off" placeholder="Movie, show, actor, director..."><button class="primary" type="submit">Search</button></form><div id="results" class="results"></div></div><script>const API='https://api.themoviedb.org/3';const t=()=>localStorage.getItem('maxTmdbToken')||'';const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function run(){const q=new URLSearchParams(location.search).get('q');if(!q)return;document.getElementById('q').value=q;const out=document.getElementById('results');if(!t()){out.innerHTML='<p class="small">Connect TMDB in MAX Settings first.</p>';return}out.innerHTML='<p class="small">MAX is searching…</p>';try{const r=await fetch(API+'/search/multi?query='+encodeURIComponent(q)+'&include_adult=false&language=en-US&page=1',{headers:{Authorization:'Bearer '+t()}});if(!r.ok)throw Error('TMDB returned '+r.status);const d=await r.json(),items=(d.results||[]).filter(x=>x.media_type==='movie'||x.media_type==='tv').slice(0,10);out.innerHTML=items.length?items.map(x=>'<a class="link" href="detail.html?id='+x.id+'&type='+x.media_type+'">'+e(x.title||x.name)+' <span class="muted">· '+(x.media_type==='tv'?'TV':'Movie')+'</span></a>').join(''):'<p class="small">MAX couldn’t find that.</p>'}catch(err){out.innerHTML='<p class="small">'+e(err.message)+'</p>'}}document.getElementById('f').addEventListener('submit',()=>{});run();</script></body></html>
